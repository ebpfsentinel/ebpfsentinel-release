# Acceptance — prove a modified artifact is inert at every layer.
#
# Runs the tamper test (policy/acceptance-tamper-test.sh) for the cosign
# signature layer (a) and the signed-measurements layer (c), and a
# kind + Kyverno check for the admission layer (b).
#
# Both directions are asserted, and the second is the one that matters most:
# tamper must be REJECTED, and a genuine release must be ADMITTED. A policy
# that denies everything satisfies the first test perfectly, so on its own it
# tells you nothing about whether what we publish can actually be deployed.
#
# Manual, on-demand: needs a published, signed release to point at. Provide a
# genuine signed image@digest; the manifest is fetched from the matching
# measurements release.
name: acceptance

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Genuine signed image ref with digest, publicly readable so Kyverno can fetch its signatures, e.g. ghcr.io/ebpfsentinel/ebpfsentinel@sha256:..."
        required: true
        type: string
      release:
        description: "Release version whose measurements manifest to test, e.g. 2026.6.1"
        required: false
        type: string
      source-repo:
        description: "Repository the image was released from (certificate caller pinning)"
        required: false
        default: ebpfsentinel/ebpfsentinel
        type: string

permissions: {}

env:
  ORG: ebpfsentinel

jobs:
  # -- (a) + (c): cosign signature + signed measurements manifest ----------
  signatures:
    name: Signature & manifest tamper
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Fetch signed measurements manifest
        if: ${{ inputs.release != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL: ${{ inputs.release }}
        run: |
          gh release download "measurements/v${REL}" \
            -R "${ORG}/ebpfsentinel-release" \
            -p 'measurements.signed*' -D man || echo "no measurements release yet"

      - name: Run tamper test (a + c + d)
        env:
          IMAGE: ${{ inputs.image }}
          SRC_REPO: ${{ inputs.source-repo }}
        run: |
          chmod +x policy/acceptance-tamper-test.sh
          args=(--image "$IMAGE" --source-repo "$SRC_REPO")
          if [ -f man/measurements.signed ]; then
            args+=(--manifest man/measurements.signed)
          fi
          ./policy/acceptance-tamper-test.sh "${args[@]}"

  # -- (b): Kyverno denies an unsigned image at admission ------------------
  admission:
    name: Kyverno admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      # Pinned, not `latest`: an acceptance run must test a known enforcer
      # version, and a moving target here would silently change what "PASS"
      # means. Bump deliberately.
      - name: Install Kyverno
        env:
          KYVERNO_VERSION: v1.16.0
        run: |
          kubectl apply -f "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/install.yaml"
          kubectl -n kyverno rollout status deploy/kyverno-admission-controller --timeout=180s

      # Both policies, because both are things customers apply. A policy this
      # repo publishes but never loads into a cluster is a policy whose schema
      # errors are discovered by the customer.
      - name: Apply the verification policies
        run: |
          kubectl apply -f policy/kyverno-verify-images.yaml
          kubectl apply -f policy/kyverno-verify-attestations.yaml
          # Give the policies a moment to register their webhooks.
          sleep 10

      # A locally-built image tagged under our namespace has no signature in
      # ghcr/rekor → Kyverno must DENY it. No registry push needed: the deny
      # path only needs the signature lookup to come up empty.
      - name: Build an unsigned in-scope image
        run: |
          printf 'FROM gcr.io/distroless/static:nonroot\n' > Dockerfile.rogue
          docker build -f Dockerfile.rogue \
            -t ghcr.io/ebpfsentinel/ebpfsentinel-acceptance-rogue:tampered .
          kind load docker-image \
            ghcr.io/ebpfsentinel/ebpfsentinel-acceptance-rogue:tampered \
            --name chart-testing

      - name: Assert the unsigned image is denied
        run: |
          if kubectl run rogue \
              --image ghcr.io/ebpfsentinel/ebpfsentinel-acceptance-rogue:tampered \
              --restart=Never; then
            echo "::error::unsigned image was ADMITTED — policy not enforcing"
            kubectl delete pod rogue --ignore-not-found
            exit 1
          fi
          echo "PASS: unsigned in-scope image denied at admission"

      # The negative test alone is a weak guarantee: a policy that denies
      # everything passes it. This is the test that says the policies we publish
      # actually let a genuine release run — including that every attestation
      # they require is present and shaped the way the conditions expect.
      #
      # Admission and image pull are different things: Kyverno rejects at
      # `kubectl run` time, whereas an unpullable image still creates the Pod.
      # So a successful `kubectl run` means the policies passed, whatever the
      # container does afterwards.
      - name: Assert a genuine signed release is admitted
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          if ! kubectl run genuine --image "$IMAGE" --restart=Never; then
            echo "::error::a genuine signed image was DENIED — the published policies reject our own release"
            kubectl delete pod genuine --ignore-not-found
            exit 1
          fi
          kubectl delete pod genuine --ignore-not-found
          echo "PASS: genuine signed image admitted by both policies"
