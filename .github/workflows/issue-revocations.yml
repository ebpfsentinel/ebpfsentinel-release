# Publish the signed revocation list.
#
# A signature says "we published this" and never stops saying it. This is the
# separate channel that says "stop running it": a dual-signed (Ed25519 +
# ML-DSA-65) list of withdrawn digests, published at a stable pointer that
# consumers poll.
#
# `revocations/current` is deliberately mutable - a revocation list that could
# not be updated would be useless. Immutability lives in the per-serial tags
# and in the monotonic `serial`, which lets a consumer detect a replayed older
# list. See docs/REVOCATION.md.
#
# Required secrets: RELEASE_SIGNING_KEY_ED25519 and RELEASE_SIGNING_KEY_MLDSA
# in the `release-signing` environment (see docs/KEY-MANAGEMENT.md).
name: issue-revocations

on:
  workflow_dispatch:
    inputs:
      license-tool-release:
        description: "Release whose ebpfsentinel-license tool signs the list, e.g. 2026.6.1 (must have releases/<version>.yaml)"
        required: true
        type: string

# The serial check reads the published list and then replaces it; two runs
# at once would both pass it. Queue, never cancel.
concurrency:
  group: issue-revocations
  cancel-in-progress: false

permissions: {}

env:
  ORG: ebpfsentinel

jobs:
  issue:
    name: Validate & dual-sign
    runs-on: ubuntu-latest
    # The signing keys are environment secrets, released only to a run a
    # reviewer approved from main (docs/REPO-HARDENING.md section 3).
    environment: release-signing
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      serial: ${{ steps.validate.outputs.serial }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the list
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LIST=policy/revocations.json
          schema="$(jq -r '.schema // empty' "$LIST")"
          if [ "$schema" != "ebpfsentinel.revocations/v1" ]; then
            echo "::error::unexpected schema '$schema'"
            exit 1
          fi
          serial="$(jq -r '.serial // empty' "$LIST")"
          if ! printf '%s' "$serial" | grep -qE '^[0-9]+$'; then
            echo "::error::serial must be a non-negative integer"
            exit 1
          fi

          # Every entry must carry enough for a consumer to act on it. An entry
          # without an advisory gets ignored or worked around in the field.
          bad="$(jq -r '
            .revocations[]
            | select(
                (.kind | IN("image","binary") | not)
                or (.digest // "" | test("^sha256:[0-9a-f]{64}$") | not)
                or ((.name // "") == "") or ((.release // "") == "")
                or ((.reason // "") == "") or ((.advisory // "") == "")
                or ((.revoked_at // "") == "")
              )
            | .digest // "<no digest>"' "$LIST")"
          if [ -n "$bad" ]; then
            echo "::error::incomplete revocation entries: $bad"
            exit 1
          fi

          # Monotonic serial: a published list must never be replaceable by an
          # older one, or replay protection on the consumer side is pointless.
          prev=0
          if gh release download revocations/current -R "${ORG}/ebpfsentinel-release" \
               -p 'revocations.json' -D prev 2>/dev/null; then
            prev="$(jq -r '.serial // 0' prev/revocations.json)"
          fi
          if [ "$serial" -le "$prev" ]; then
            echo "::error::serial $serial does not advance past the published serial $prev"
            exit 1
          fi
          echo "serial=$serial" >> "$GITHUB_OUTPUT"
          echo "publishing serial $serial (previous: $prev)"

      # The tool that signs the list is the one a release shipped, taken from
      # this repository's release where every tarball now lives, and it runs
      # only once its keyless signature verifies against our identity and our
      # repository: an unverified binary handed the signing keys would be the
      # cheapest way to forge a revocation list.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify the license tool
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REL: ${{ inputs.license-tool-release }}
        run: |
          set -euo pipefail
          if ! echo "$REL" | grep -qE '^[0-9]{4}\.([1-9]|1[0-2])\.[0-9]+$'; then
            echo "::error::license-tool-release must be YYYY.M.X, got: $REL"
            exit 1
          fi
          MANIFEST="releases/${REL}.yaml"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::$MANIFEST not found"
            exit 1
          fi
          tarball="$(python3 scripts/check-release-manifest.py --binaries "$MANIFEST" \
            | awk -F'\t' '$4 == "ebpfsentinel-license" && $5 == "amd64" {print $3; exit}')"
          if [ -z "$tarball" ]; then
            echo "::error::release $REL declares no ebpfsentinel-license binary for amd64"
            exit 1
          fi
          mkdir -p dl ex
          for f in "$tarball" "${tarball}.sig" "${tarball}.crt"; do
            gh release download "v${REL}" --pattern "$f" --dir dl
          done
          bash policy/verify.sh blob "dl/${tarball}" "dl/${tarball}.sig" "dl/${tarball}.crt"
          tar xzf "dl/${tarball}" -C ex
          path="$(find ex -type f -name ebpfsentinel-license | head -1)"
          if [ -z "$path" ]; then
            echo "::error::ebpfsentinel-license not found inside ${tarball}"
            exit 1
          fi
          install -m 0755 "$path" ./ebpfsentinel-license

      - name: Dual-sign the list
        env:
          ED_KEY: ${{ secrets.RELEASE_SIGNING_KEY_ED25519 }}
          ML_KEY: ${{ secrets.RELEASE_SIGNING_KEY_MLDSA }}
        run: |
          if [ -z "$ED_KEY" ] || [ -z "$ML_KEY" ]; then
            echo "::error::release signing secrets are not set - see docs/KEY-MANAGEMENT.md"
            exit 1
          fi
          printf '%s' "$ED_KEY" > ed25519.key
          printf '%s' "$ML_KEY" > mldsa.key
          ./ebpfsentinel-license sign-manifest \
            --input policy/revocations.json \
            --signing-key ed25519.key \
            --pq-signing-key mldsa.key \
            --output revocations.signed
          shred -u ed25519.key mldsa.key
          ./ebpfsentinel-license verify-manifest \
            --input revocations.signed \
            --public-key policy/keys/release-signing-ed25519.pub \
            --pq-public-key policy/keys/release-signing-mldsa.pub

      - name: Bundle for signing
        run: |
          mkdir -p out
          cp policy/revocations.json revocations.signed out/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: revocations
          path: out/
          retention-days: 30

  sign-blobs:
    name: Sign list (keyless)
    needs: [issue]
    permissions:
      id-token: write
      contents: read
      attestations: write
    uses: ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-blob.yml@v1
    with:
      artifact-name: revocations

  publish:
    name: Publish list
    needs: [issue, sign-blobs]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: revocations
          path: pub

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: revocations-signatures
          path: pub

      - name: Stage consumer helpers
        run: |
          cp policy/verify.sh policy/check-revocation.sh \
             policy/gen-revocation-policy.sh pub/
          cp policy/keys/release-signing-ed25519.pub \
             policy/keys/release-signing-mldsa.pub pub/

      # Immutable per-serial release: the audit trail. Published first, so a
      # failure here never leaves `current` pointing at something unrecorded.
      - name: Publish serial release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERIAL: ${{ needs.issue.outputs.serial }}
        run: |
          TAG="revocations/v${SERIAL}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists - serials are append-only"
            exit 1
          fi
          gh release create "$TAG" pub/* \
            --title "Revocations serial ${SERIAL}" \
            --notes "Dual-signed revocation list, serial ${SERIAL}. Immutable snapshot; consumers should poll the revocations/current pointer. See docs/REVOCATION.md."

      # Mutable pointer: what consumers actually poll.
      - name: Update the current pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERIAL: ${{ needs.issue.outputs.serial }}
        run: |
          gh release delete revocations/current --yes --cleanup-tag 2>/dev/null || true
          gh release create revocations/current pub/* \
            --title "Revocations (current)" \
            --notes "Current dual-signed revocation list, serial ${SERIAL}. This pointer is replaced on every update; the immutable snapshot is revocations/v${SERIAL}. Reject any list whose serial is lower than one you have already seen. See docs/REVOCATION.md."
