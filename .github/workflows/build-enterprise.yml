# Builds, pushes and signs the Enterprise agent from THIS repository.
#
# Enterprise binaries and images are published publicly and on purpose: a
# customer has to be able to download and verify them without asking anyone.
# The licence gates features at runtime, not the download.
#
# The enterprise crates depend on the OSS ones through `../ebpfsentinel/crates/*`
# path deps, so this workflow checks out both components at the commits the
# release manifest pins and lays them out as siblings.
name: build-enterprise

on:
  workflow_call:
    inputs:
      version:
        description: "Version to stamp and publish (YYYY.M.X)"
        required: true
        type: string
      ref:
        description: "Commit sha in ebpfsentinel/ebpfsentinel-enterprise to build"
        required: true
        type: string
      oss-ref:
        description: "Commit sha of the OSS agent the path deps resolve against"
        required: true
        type: string
      push:
        description: "Push images to GHCR (off for a dry run)"
        required: false
        default: true
        type: boolean
    outputs:
      bundle-artifact:
        description: "Artifact holding the release tarballs"
        value: enterprise-bundle

permissions: {}

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  COMPONENT_REPO: ebpfsentinel/ebpfsentinel-enterprise
  OSS_REPO_URL: https://github.com/ebpfsentinel/ebpfsentinel.git
  IMAGE: ghcr.io/ebpfsentinel/ebpfsentinel-enterprise
  WARDEN_IMAGE: ghcr.io/ebpfsentinel/ebpfsentinel-enterprise-warden
  IMAGE_DESCRIPTION: eBPFsentinel Enterprise agent (licence-gated features on the OSS core)
  WARDEN_DESCRIPTION: Privileged kernel-operation control plane for a rootless eBPFsentinel Enterprise agent
  LICENSE: LicenseRef-Proprietary

jobs:
  # ── Release tarballs, one per architecture ────────────────────────
  #
  # Cut from `Dockerfile.agent`'s `binaries` stage rather than from a toolchain
  # this workflow assembles itself. A static musl enterprise binary needs a musl
  # C++ compiler for Vectorscan and an ONNX Runtime compiled for musl, neither of
  # which a Debian-based runner can supply - `ort` publishes prebuilt ONNX Runtime
  # for glibc only, and Debian packages a musl C compiler but no musl g++. The
  # Dockerfile already solves both on Alpine, so reusing it keeps one definition
  # of the toolchain and makes the tarball and the image ship identical bytes.
  build-release:
    name: Build ${{ inputs.version }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # Only the enterprise tree: the Dockerfile fetches the OSS sources its path
      # deps resolve against itself, at the commit the release manifest pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ebpfsentinel/ebpfsentinel-enterprise
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.COMPONENT_CHECKOUT_TOKEN }}

      # The runner ships ~14 GB free and this build compiles the workspace, ONNX
      # Runtime and the kernel programs on it, then stages a `mode=max` cache
      # export beside them. Dropping the preinstalled toolchains this build never
      # touches buys the ~25 GB that keeps it off `No space left on device`.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Stamps the enterprise manifests before they enter the build context, so
      # the binary reports the release version rather than the placeholder.
      - uses: ./src/.github/actions/stamp-version
        with:
          version: ${{ inputs.version }}

      # The runner is already the target architecture, so this is a native build
      # and needs no `platforms:`. The cache scope is deliberately the one the
      # image job uses: the ONNX Runtime layer is by far the most expensive in
      # this build and there is no reason to compile it twice per release.
      - name: Build release binaries
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: src
          file: src/Dockerfile.agent
          target: binaries
          push: false
          provenance: false
          sbom: false
          build-args: |
            OSS_REPO=${{ env.OSS_REPO_URL }}
            OSS_REF=${{ inputs.oss-ref }}
          cache-from: type=gha,scope=enterprise-agent-${{ matrix.arch }}
          cache-to: type=gha,scope=enterprise-agent-${{ matrix.arch }},mode=max
          outputs: type=local,dest=binaries

      - name: Create release tarball
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          STAGING="ebpfsentinel-enterprise-${VERSION}-linux-${ARCH}"
          mkdir -p "${STAGING}"
          install -m 0755 binaries/ebpfsentinel-enterprise-agent "${STAGING}/"
          install -m 0755 binaries/ebpfsentinel-license "${STAGING}/"
          cp src/LICENSE "${STAGING}/"
          tar czf "${STAGING}.tar.gz" "${STAGING}"
          echo "TARBALL=${STAGING}.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enterprise-release-${{ matrix.arch }}
          path: ${{ env.TARBALL }}
          retention-days: 30

  bundle:
    name: Bundle artifacts
    needs: [build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bundle
          pattern: enterprise-release-*
          merge-multiple: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enterprise-bundle
          path: bundle/
          retention-days: 7

  # The full remote form is deliberate even from inside this repository:
  # Sigstore records the CALLED ref as the certificate subject, and every
  # published policy pins @refs/tags/v*.
  sign-blobs:
    name: Sign blobs
    needs: [bundle]
    permissions:
      id-token: write
      contents: read
      attestations: write
    uses: ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-blob.yml@v1
    with:
      artifact-name: enterprise-bundle

  # ── Per-platform images ───────────────────────────────────────────
  #
  # The split image pair, same as OSS: a rootless enterprise agent plus the
  # privileged warden that delegates it a bpffs. Both Dockerfiles fetch the OSS
  # tree themselves at OSS_REF, so the pinned commit reaches the image build the
  # same way it reaches the binary build above.
  build-images:
    name: Image ${{ matrix.component }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [agent, warden]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - component: agent
            dockerfile: Dockerfile.agent
            suffix: ""
            title: eBPFsentinel Enterprise
          - component: warden
            dockerfile: Dockerfile.warden
            suffix: "-warden"
            title: eBPFsentinel Enterprise warden
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ebpfsentinel/ebpfsentinel-enterprise
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.COMPONENT_CHECKOUT_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract platform architecture
        run: echo "PLATFORM_ARCH=${platform##*/}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      # Same reason as the binary job: this is the identical build tree plus a
      # `mode=max` cache export on a runner that starts with ~14 GB free.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: ./src/.github/actions/stamp-version
        with:
          version: ${{ inputs.version }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}${{ matrix.suffix }}
          tags: |
            type=raw,value=${{ inputs.version }}-${{ env.PLATFORM_ARCH }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.component == 'agent' && env.IMAGE_DESCRIPTION || env.WARDEN_DESCRIPTION }} (${{ env.PLATFORM_ARCH }})
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.vendor=eBPFsentinel
            org.opencontainers.image.licenses=${{ env.LICENSE }}
            org.opencontainers.image.source=https://github.com/${{ env.COMPONENT_REPO }}
            org.opencontainers.image.documentation=https://github.com/ebpfsentinel/ebpfsentinel-docs
            org.opencontainers.image.revision=${{ inputs.ref }}

      - name: Build and push platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: src
          file: src/${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.push }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ inputs.version }}
            OSS_REPO=${{ env.OSS_REPO_URL }}
            OSS_REF=${{ inputs.oss-ref }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=enterprise-${{ matrix.component }}-${{ env.PLATFORM_ARCH }}
          cache-to: type=gha,scope=enterprise-${{ matrix.component }}-${{ env.PLATFORM_ARCH }},mode=max
          outputs: type=image,oci-mediatypes=true

  # Both images in one job rather than a matrix: the signing jobs below need a
  # digest per image, and matrix job outputs are last-writer-wins.
  create-manifest:
    name: Multi-arch manifests
    needs: [build-images]
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      agent_image: ${{ steps.manifests.outputs.agent_image }}
      agent_digest: ${{ steps.manifests.outputs.agent_digest }}
      warden_image: ${{ steps.manifests.outputs.warden_image }}
      warden_digest: ${{ steps.manifests.outputs.warden_digest }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Create and push multi-arch manifests
        id: manifests
        env:
          VERSION: ${{ inputs.version }}
          AGENT_IMAGE: ${{ env.IMAGE }}
          WARDEN_IMAGE: ${{ env.WARDEN_IMAGE }}
          AGENT_DESCRIPTION: ${{ env.IMAGE_DESCRIPTION }}
          WARDEN_DESCRIPTION: ${{ env.WARDEN_DESCRIPTION }}
          SOURCE: https://github.com/${{ env.COMPONENT_REPO }}
          LICENSE: ${{ env.LICENSE }}
        run: |
          set -euo pipefail
          for component in agent warden; do
            case "$component" in
              agent)  image="${AGENT_IMAGE}";  description="${AGENT_DESCRIPTION}" ;;
              warden) image="${WARDEN_IMAGE}"; description="${WARDEN_DESCRIPTION}" ;;
            esac

            docker buildx imagetools create \
              -t "${image}:${VERSION}" \
              -t "${image}:latest" \
              --annotation="index:org.opencontainers.image.description=${description}" \
              --annotation="index:org.opencontainers.image.source=${SOURCE}" \
              --annotation="index:org.opencontainers.image.licenses=${LICENSE}" \
              "${image}:${VERSION}-amd64" \
              "${image}:${VERSION}-arm64"

            digest="$(docker buildx imagetools inspect "${image}:${VERSION}" --format '{{.Manifest.Digest}}')"
            echo "${component}_image=${image}" >> "$GITHUB_OUTPUT"
            echo "${component}_digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "${component}: ${image}@${digest}"
          done

  sign:
    name: Sign agent image
    needs: [create-manifest]
    permissions:
      id-token: write
      packages: write
      contents: read
    uses: ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@v1
    with:
      image: ${{ needs.create-manifest.outputs.agent_image }}
      digest: ${{ needs.create-manifest.outputs.agent_digest }}

  sign-warden:
    name: Sign warden image
    needs: [create-manifest]
    permissions:
      id-token: write
      packages: write
      contents: read
    uses: ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@v1
    with:
      image: ${{ needs.create-manifest.outputs.warden_image }}
      digest: ${{ needs.create-manifest.outputs.warden_digest }}
