# Builds, pushes and signs the Enterprise agent, its warden and its Helm chart
# from THIS repository.
#
# Enterprise binaries and images are published publicly and on purpose: a
# customer has to be able to download and verify them without asking anyone.
# The licence gates features at runtime, not the download.
#
# The enterprise crates depend on the OSS ones through `../ebpfsentinel/crates/*`
# path deps, so this workflow checks out both components at the commits the
# release manifest pins and lays them out as siblings.
name: build-enterprise

on:
  workflow_call:
    secrets:
      SIBLING_READ_TOKEN:
        description: "Read token for the private component repositories (optional for public ones)"
        required: false
    inputs:
      version:
        description: "Version to stamp and publish (YYYY.M.X)"
        required: true
        type: string
      ref:
        description: "Commit sha in ebpfsentinel/ebpfsentinel-enterprise to build"
        required: true
        type: string
      oss-ref:
        description: "Commit sha of the OSS agent the path deps resolve against"
        required: true
        type: string
      anomstream-ref:
        description: "Commit sha of anomstream the path deps resolve against"
        required: true
        type: string
      push:
        description: "Push images to GHCR (off for a dry run)"
        required: false
        default: true
        type: boolean
    outputs:
      bundle-artifact:
        description: "Artifact holding the release tarballs"
        value: enterprise-bundle

permissions: {}

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  COMPONENT_REPO: ebpfsentinel/ebpfsentinel-enterprise
  OSS_REPO_URL: https://github.com/ebpfsentinel/ebpfsentinel.git
  ANOMSTREAM_REPO_URL: https://github.com/ebpfsentinel/anomstream.git
  IMAGE: ghcr.io/ebpfsentinel/ebpfsentinel-enterprise
  WARDEN_IMAGE: ghcr.io/ebpfsentinel/ebpfsentinel-enterprise-warden
  IMAGE_DESCRIPTION: eBPFsentinel Enterprise agent (licence-gated features on the OSS core)
  WARDEN_DESCRIPTION: Privileged kernel-operation control plane for a rootless eBPFsentinel Enterprise agent
  LICENSE: LicenseRef-Proprietary

jobs:
  # ── Release tarballs, one per architecture ────────────────────────
  #
  # Cut from `Dockerfile.agent`'s `binaries` stage rather than from a toolchain
  # this workflow assembles itself. A static musl enterprise binary needs a musl
  # C++ compiler for Vectorscan and an ONNX Runtime compiled for musl, neither of
  # which a Debian-based runner can supply - `ort` publishes prebuilt ONNX Runtime
  # for glibc only, and Debian packages a musl C compiler but no musl g++. The
  # Dockerfile already solves both on Alpine, so reusing it keeps one definition
  # of the toolchain and makes the tarball and the image ship identical bytes.
  build-release:
    name: Build ${{ inputs.version }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # Only the enterprise tree: the Dockerfile fetches the OSS sources its path
      # deps resolve against itself, at the commit the release manifest pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ebpfsentinel/ebpfsentinel-enterprise
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.SIBLING_READ_TOKEN }}

      # This repository, for the published licence signing public keys. They
      # travel in the tarball beside the tool that consumes them: a customer who
      # downloads a licence over a web session must not also receive the key
      # that proves it down the same wire, and one who has the binary but no key
      # has been handed a command they cannot run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: release

      # The runner ships ~14 GB free and this build compiles the workspace, ONNX
      # Runtime and the kernel programs on it. Dropping the preinstalled toolchains this build never
      # touches buys the ~25 GB that keeps it off `No space left on device`.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Stamps the enterprise manifests before they enter the build context, so
      # the binary reports the release version rather than the placeholder.
      - uses: ./src/.github/actions/stamp-version
        with:
          version: ${{ inputs.version }}

      # The runner is already the target architecture, so this is a native build
      # and needs no `platforms:`. No build cache is read or written: a release
      # is compiled from the source at its ref and nothing a pull request run
      # could have left in the Actions cache.
      - name: Build release binaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: src
          file: src/Dockerfile.agent
          target: binaries
          push: false
          provenance: false
          sbom: false
          # `TELEMETRY_ENDPOINT` is where the agent's anonymous heartbeat goes.
          # A repository variable rather than a secret on purpose: it is
          # compiled into a shipped binary, `strings` finds it, and masking it
          # in the log would be confidence nobody has earned. Unset, it is
          # empty, an empty endpoint is refused at boot, and the tarball is
          # inert - which is the right outcome for anything but a real release.
          build-args: |
            OSS_REPO=${{ env.OSS_REPO_URL }}
            OSS_REF=${{ inputs.oss-ref }}
            ANOMSTREAM_REPO=${{ env.ANOMSTREAM_REPO_URL }}
            ANOMSTREAM_REF=${{ inputs.anomstream-ref }}
            TELEMETRY_ENDPOINT=${{ vars.TELEMETRY_ENDPOINT }}
          outputs: type=local,dest=binaries

      # The broker the rootless agent asks for its bpffs. Built from its own
      # Dockerfile's export stage so the tarball and the warden image ship the
      # same bytes.
      - name: Build warden binary
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: src
          file: src/Dockerfile.warden
          target: binaries
          push: false
          provenance: false
          sbom: false
          build-args: |
            OSS_REPO=${{ env.OSS_REPO_URL }}
            OSS_REF=${{ inputs.oss-ref }}
            ANOMSTREAM_REPO=${{ env.ANOMSTREAM_REPO_URL }}
            ANOMSTREAM_REF=${{ inputs.anomstream-ref }}
          outputs: type=local,dest=warden

      - name: Create release tarball
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          STAGING="ebpfsentinel-enterprise-${VERSION}-linux-${ARCH}"
          mkdir -p "${STAGING}/ebpf"
          install -m 0755 binaries/ebpfsentinel-enterprise-agent "${STAGING}/"
          install -m 0755 binaries/ebpfsentinel-license "${STAGING}/"
          install -m 0755 warden/enterprise-warden "${STAGING}/"
          # The layout is the one `dist/install.sh` reads: the kernel programs
          # under `ebpf/`, the default configuration, both systemd units, and
          # the AppArmor profile and sysctl drop-in it installs on hosts that
          # gate unprivileged user namespaces. The seccomp profile stays out:
          # it applies to the container deployment, not to a systemd unit.
          if [ -z "$(ls -A binaries/ebpf)" ]; then
            echo "::error::the agent build exported no kernel programs"
            exit 1
          fi
          cp binaries/ebpf/* "${STAGING}/ebpf/"
          install -m 0644 src/config/ebpfsentinel.yaml "${STAGING}/"
          install -m 0644 src/dist/ebpfsentinel-enterprise.service "${STAGING}/"
          install -m 0644 src/dist/ebpfsentinel-enterprise-warden.service "${STAGING}/"
          install -m 0755 src/dist/install.sh "${STAGING}/"
          cp -a src/dist/apparmor.d "${STAGING}/"
          cp -a src/dist/sysctl.d "${STAGING}/"
          # Fail closed. Shipping the tool without the keys leaves a customer
          # holding a licence they can checksum and cannot authenticate, which
          # is the one check that actually says the file is ours.
          for key in license-signing.pub license-signing-pq.pub; do
            if [ ! -s "release/policy/keys/${key}" ]; then
              echo "::error::policy/keys/${key} is missing or empty - see docs/KEY-MANAGEMENT.md"
              exit 1
            fi
            install -m 0644 "release/policy/keys/${key}" "${STAGING}/"
          done
          cp src/LICENSE "${STAGING}/"
          tar czf "${STAGING}.tar.gz" "${STAGING}"
          echo "TARBALL=${STAGING}.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enterprise-release-${{ matrix.arch }}
          path: ${{ env.TARBALL }}
          retention-days: 30

  bundle:
    name: Bundle artifacts
    needs: [build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bundle
          pattern: enterprise-release-*
          merge-multiple: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enterprise-bundle
          path: bundle/
          retention-days: 7

  # The full remote form is deliberate even from inside this repository:
  # Sigstore records the CALLED ref as the certificate subject, and every
  # published policy pins @refs/tags/v*.
  sign-blobs:
    name: Sign blobs
    needs: [bundle]
    # A dry run publishes nothing, so it writes nothing to the transparency log
    # either, and it can run from any branch the signing gate would refuse.
    if: inputs.push
    permissions:
      id-token: write
      contents: read
      attestations: write
    uses: ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-blob.yml@v1
    with:
      artifact-name: enterprise-bundle

  # ── Per-platform images ───────────────────────────────────────────
  #
  # The split image pair, same as OSS: a rootless enterprise agent plus the
  # privileged warden that delegates it a bpffs. Both Dockerfiles fetch the OSS
  # and anomstream trees themselves at OSS_REF and ANOMSTREAM_REF, so the pinned
  # commits reach the image build the same way they reach the binary build above.
  build-images:
    name: Image ${{ matrix.component }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [agent, warden]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - component: agent
            dockerfile: Dockerfile.agent
            suffix: ""
            title: eBPFsentinel Enterprise
          - component: warden
            dockerfile: Dockerfile.warden
            suffix: "-warden"
            title: eBPFsentinel Enterprise warden
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ebpfsentinel/ebpfsentinel-enterprise
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.SIBLING_READ_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract platform architecture
        run: echo "PLATFORM_ARCH=${platform##*/}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      # Same reason as the binary job: this is the identical build tree on a
      # runner that starts with ~14 GB free.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: ./src/.github/actions/stamp-version
        with:
          version: ${{ inputs.version }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}${{ matrix.suffix }}
          tags: |
            type=raw,value=${{ inputs.version }}-${{ env.PLATFORM_ARCH }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.component == 'agent' && env.IMAGE_DESCRIPTION || env.WARDEN_DESCRIPTION }} (${{ env.PLATFORM_ARCH }})
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.vendor=eBPFsentinel
            org.opencontainers.image.licenses=${{ env.LICENSE }}
            org.opencontainers.image.source=https://github.com/${{ env.COMPONENT_REPO }}
            org.opencontainers.image.documentation=https://github.com/ebpfsentinel/ebpfsentinel-docs
            org.opencontainers.image.revision=${{ inputs.ref }}

      - name: Build and push platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: src
          file: src/${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.push }}
          provenance: false
          sbom: false
          # The endpoint goes to the agent only: the warden brokers eBPF loads
          # and sends no heartbeat, so passing it there would be an argument its
          # Dockerfile does not declare.
          build-args: |
            VERSION=${{ inputs.version }}
            OSS_REPO=${{ env.OSS_REPO_URL }}
            OSS_REF=${{ inputs.oss-ref }}
            ANOMSTREAM_REPO=${{ env.ANOMSTREAM_REPO_URL }}
            ANOMSTREAM_REF=${{ inputs.anomstream-ref }}
            ${{ matrix.component == 'agent' && format('TELEMETRY_ENDPOINT={0}', vars.TELEMETRY_ENDPOINT) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,oci-mediatypes=true

  # Both images in one job rather than a matrix: the signing jobs below need a
  # digest per image, and matrix job outputs are last-writer-wins.
  create-manifest:
    name: Multi-arch manifests
    needs: [build-images]
    if: inputs.push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write # build-provenance attestation
      attestations: write
    outputs:
      agent_image: ${{ steps.manifests.outputs.agent_image }}
      agent_digest: ${{ steps.manifests.outputs.agent_digest }}
      warden_image: ${{ steps.manifests.outputs.warden_image }}
      warden_digest: ${{ steps.manifests.outputs.warden_digest }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create and push multi-arch manifests
        id: manifests
        env:
          VERSION: ${{ inputs.version }}
          AGENT_IMAGE: ${{ env.IMAGE }}
          WARDEN_IMAGE: ${{ env.WARDEN_IMAGE }}
          AGENT_DESCRIPTION: ${{ env.IMAGE_DESCRIPTION }}
          WARDEN_DESCRIPTION: ${{ env.WARDEN_DESCRIPTION }}
          SOURCE: https://github.com/${{ env.COMPONENT_REPO }}
          LICENSE: ${{ env.LICENSE }}
        run: |
          set -euo pipefail
          for component in agent warden; do
            case "$component" in
              agent)  image="${AGENT_IMAGE}";  description="${AGENT_DESCRIPTION}" ;;
              warden) image="${WARDEN_IMAGE}"; description="${WARDEN_DESCRIPTION}" ;;
            esac

            docker buildx imagetools create \
              -t "${image}:${VERSION}" \
              -t "${image}:latest" \
              --annotation="index:org.opencontainers.image.description=${description}" \
              --annotation="index:org.opencontainers.image.source=${SOURCE}" \
              --annotation="index:org.opencontainers.image.licenses=${LICENSE}" \
              "${image}:${VERSION}-amd64" \
              "${image}:${VERSION}-arm64"

            digest="$(docker buildx imagetools inspect "${image}:${VERSION}" --format '{{.Manifest.Digest}}')"
            echo "${component}_image=${image}" >> "$GITHUB_OUTPUT"
            echo "${component}_digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "${component}: ${image}@${digest}"
          done

      # The per-platform builds push with BuildKit provenance off, so without
      # this the index customers pull carries no SLSA statement at all. It is
      # attached here, to that digest: which workflow run, at which source
      # ref, produced this index.
      - name: Attest agent build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.manifests.outputs.agent_image }}
          subject-digest: ${{ steps.manifests.outputs.agent_digest }}
          push-to-registry: true

      - name: Attest warden build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.manifests.outputs.warden_image }}
          subject-digest: ${{ steps.manifests.outputs.warden_digest }}
          push-to-registry: true

  sign:
    name: Sign agent image
    needs: [create-manifest]
    permissions:
      id-token: write
      packages: write
      contents: read
    uses: ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@v1
    with:
      image: ${{ needs.create-manifest.outputs.agent_image }}
      digest: ${{ needs.create-manifest.outputs.agent_digest }}

  sign-warden:
    name: Sign warden image
    needs: [create-manifest]
    permissions:
      id-token: write
      packages: write
      contents: read
    uses: ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@v1
    with:
      image: ${{ needs.create-manifest.outputs.warden_image }}
      digest: ${{ needs.create-manifest.outputs.warden_digest }}

  # ── Helm chart, stamped with the version of the images it deploys ──
  #
  # The chart points at the agent and warden images above, so it carries the
  # same version and ships in the same run rather than behind a tag of its own.
  helm:
    name: Helm chart
    needs: [create-manifest]
    if: inputs.push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ebpfsentinel/ebpfsentinel-enterprise
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.SIBLING_READ_TOKEN }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Stamp version in Chart.yaml
        working-directory: src
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^version: .*/version: ${VERSION}/" charts/ebpfsentinel-enterprise/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" charts/ebpfsentinel-enterprise/Chart.yaml
          grep -E '^(version|appVersion):' charts/ebpfsentinel-enterprise/Chart.yaml

      - name: Lint chart
        working-directory: src
        run: helm lint charts/ebpfsentinel-enterprise/

      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Package chart
        working-directory: src
        run: helm package charts/ebpfsentinel-enterprise/

      - name: Push chart to GHCR
        id: push
        working-directory: src
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          helm push "ebpfsentinel-enterprise-${VERSION}.tgz" "oci://ghcr.io/ebpfsentinel/charts" 2>&1 | tee push.log
          DIGEST="$(grep -oiE 'sha256:[0-9a-f]{64}' push.log | head -1)"
          if [ -z "$DIGEST" ]; then
            echo "::error::could not parse the pushed chart digest from helm output"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/ebpfsentinel/charts/ebpfsentinel-enterprise" >> "$GITHUB_OUTPUT"

  # No SBOM: syft produces nothing meaningful for a Helm chart.
  sign-helm:
    name: Sign chart
    needs: [helm]
    permissions:
      id-token: write
      packages: write
      contents: read
    uses: ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@v1
    with:
      image: ${{ needs.helm.outputs.image }}
      digest: ${{ needs.helm.outputs.digest }}
      sbom: false
