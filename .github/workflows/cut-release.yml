# Cut a release of the whole product, from here.
#
# Everything is built here. The component repositories hold source and their own
# `ci.yml`; they publish nothing. This run checks each component out at the
# commit `releases/<version>.yaml` pins, compiles it, pushes and signs its
# images, and publishes one release with the resulting tarballs. Every ghcr.io
# tag a customer can pull therefore comes from a run of this workflow, which is
# what makes the signed inventory complete by construction rather than by
# somebody remembering to add a component to it.
#
# What this does, given releases/<version>.yaml:
#   1. validates the manifest and the per-component changelogs
#   2. builds every component at its pinned commit, signing as it goes
#   3. checks that every tarball and every image the manifest promises exists
#   4. publishes ONE draft release v<version> here, with the aggregated notes
#
# The build workflows are called, not dispatched, so their artifacts land in
# this run's own artifact scope: no cross-repository token, no run-id hunting,
# no waiting loop.
#
# After publishing the draft, run issue-measurements.yml for the same version
# to produce the signed inventory.
#
# Prerequisites, once:
#   - secret COMPONENT_CHECKOUT_TOKEN: fine-grained PAT with contents:read on
#     the component repositories (the private ones cannot be checked out with
#     GITHUB_TOKEN from here)
#   - each package this release publishes grants this repository Write under
#     "Manage Actions access"; GITHUB_TOKEN then covers both the image push and
#     the cosign signature push
#   - environment `crates-io` with CARGO_REGISTRY_TOKEN, for anomstream
name: Cut release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Product version to cut (must have releases/<version>.yaml)"
        required: true
        type: string
      only:
        description: "Optional comma-separated component names to (re)build; default all"
        required: false
        type: string
      draft:
        description: "Publish as a draft (uncheck only when re-cutting a reviewed release)"
        required: false
        default: true
        type: boolean
      dry-run:
        description: "Build everything but push nothing: no images, no crates, no release"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  # ── What this release is ──────────────────────────────────────────
  #
  # Emits one pair of outputs per component. Underscores rather than the
  # component's own name because a GitHub expression cannot dereference a key
  # containing a hyphen. Versions and refs are emitted for every component in
  # the manifest, including ones `only` excludes: the enterprise and dashboard
  # builds need the OSS commit whether or not the OSS agent is being rebuilt.
  plan:
    name: Plan ${{ inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ebpfsentinel_version: ${{ steps.plan.outputs.ebpfsentinel_version }}
      ebpfsentinel_ref: ${{ steps.plan.outputs.ebpfsentinel_ref }}
      ebpfsentinel_selected: ${{ steps.plan.outputs.ebpfsentinel_selected }}
      enterprise_version: ${{ steps.plan.outputs.enterprise_version }}
      enterprise_ref: ${{ steps.plan.outputs.enterprise_ref }}
      enterprise_selected: ${{ steps.plan.outputs.enterprise_selected }}
      operator_version: ${{ steps.plan.outputs.operator_version }}
      operator_ref: ${{ steps.plan.outputs.operator_ref }}
      operator_selected: ${{ steps.plan.outputs.operator_selected }}
      dashboard_version: ${{ steps.plan.outputs.dashboard_version }}
      dashboard_ref: ${{ steps.plan.outputs.dashboard_ref }}
      dashboard_selected: ${{ steps.plan.outputs.dashboard_selected }}
      anomstream_version: ${{ steps.plan.outputs.anomstream_version }}
      anomstream_ref: ${{ steps.plan.outputs.anomstream_ref }}
      anomstream_selected: ${{ steps.plan.outputs.anomstream_selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release input
        env:
          REL: ${{ inputs.release }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REL" | grep -qE '^[0-9]{4}\.(1[0-2]|[1-9])\.[0-9]+$'; then
            echo "::error::release must be YYYY.M.X, got: $REL"
            exit 1
          fi
          test -f "releases/${REL}.yaml" || {
            echo "::error::releases/${REL}.yaml does not exist. Declare the release before cutting it"
            exit 1
          }

      - name: Install tooling
        run: pip install --quiet pyyaml

      # Refuses a manifest whose components have no notes for the version they
      # declare, before anything is built. A release nobody can read is caught
      # cheaply here and expensively after five builds.
      - name: Validate manifest and changelogs
        id: manifest
        env:
          REL: ${{ inputs.release }}
        run: |
          set -euo pipefail
          MANIFEST="releases/${REL}.yaml"
          ./scripts/check-release-manifest.py "$MANIFEST"
          ./scripts/check-release-manifest.py --components "$MANIFEST" > components.tsv
          ./scripts/check-release-manifest.py --binaries "$MANIFEST" > binaries.tsv
          ./scripts/check-release-manifest.py --images "$MANIFEST" > images.tsv
          echo "manifest=${MANIFEST}" >> "$GITHUB_OUTPUT"
          cat components.tsv

      - name: Aggregate release notes
        env:
          MANIFEST: ${{ steps.manifest.outputs.manifest }}
        run: |
          set -euo pipefail
          ./scripts/aggregate-changelog.py "$MANIFEST" --output release-notes.md
          cat release-notes.md

      # An unknown component name is an error rather than a skip: there is no
      # build job for it, so skipping would publish a release whose manifest
      # promises something nothing produced.
      - name: Resolve component plan
        id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          while IFS="$(printf '\t')" read -r name repo version ref; do
            [ -z "$name" ] && continue
            case "$name" in
              ebpfsentinel)            key=ebpfsentinel ;;
              ebpfsentinel-enterprise) key=enterprise ;;
              ebpfsentinel-operator)   key=operator ;;
              ebpfsentinel-dashboard)  key=dashboard ;;
              anomstream)              key=anomstream ;;
              *)
                echo "::error::no build workflow for component '${name}'. Add .github/workflows/build-<component>.yml and a job in cut-release.yml"
                exit 1
                ;;
            esac

            echo "${key}_version=${version}" >> "$GITHUB_OUTPUT"
            echo "${key}_ref=${ref}" >> "$GITHUB_OUTPUT"

            if [ -z "$ONLY" ] || printf '%s' ",${ONLY}," | grep -qF ",${name},"; then
              echo "${key}_selected=true" >> "$GITHUB_OUTPUT"
              echo "will build ${name} ${version} @ ${ref} (${repo})"
            else
              echo "${key}_selected=false" >> "$GITHUB_OUTPUT"
              echo "skipping ${name} (not in 'only')"
            fi
          done < components.tsv

      # Carried to the publish job as an artifact rather than as outputs: the
      # notes are a file and the two .tsv files are checked line by line there.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: |
            release-notes.md
            binaries.tsv
            images.tsv
            releases/${{ inputs.release }}.yaml
          retention-days: 7

  # ── One job per component ─────────────────────────────────────────
  #
  # Static rather than a matrix over the manifest: `uses:` must be a literal, so
  # a manifest-driven fan-out is not expressible. The `if` is what the manifest
  # drives.
  ebpfsentinel:
    name: ebpfsentinel
    needs: [plan]
    if: needs.plan.outputs.ebpfsentinel_selected == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-ebpfsentinel.yml
    with:
      version: ${{ needs.plan.outputs.ebpfsentinel_version }}
      ref: ${{ needs.plan.outputs.ebpfsentinel_ref }}
      push: ${{ !inputs.dry-run }}
    secrets: inherit

  enterprise:
    name: ebpfsentinel-enterprise
    needs: [plan]
    if: needs.plan.outputs.enterprise_selected == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-enterprise.yml
    with:
      version: ${{ needs.plan.outputs.enterprise_version }}
      ref: ${{ needs.plan.outputs.enterprise_ref }}
      push: ${{ !inputs.dry-run }}
      oss-ref: ${{ needs.plan.outputs.ebpfsentinel_ref }}
    secrets: inherit

  operator:
    name: ebpfsentinel-operator
    needs: [plan]
    if: needs.plan.outputs.operator_selected == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-operator.yml
    with:
      version: ${{ needs.plan.outputs.operator_version }}
      ref: ${{ needs.plan.outputs.operator_ref }}
      push: ${{ !inputs.dry-run }}
    secrets: inherit

  dashboard:
    name: ebpfsentinel-dashboard
    needs: [plan]
    if: needs.plan.outputs.dashboard_selected == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-dashboard.yml
    with:
      version: ${{ needs.plan.outputs.dashboard_version }}
      ref: ${{ needs.plan.outputs.dashboard_ref }}
      push: ${{ !inputs.dry-run }}
      oss-ref: ${{ needs.plan.outputs.ebpfsentinel_ref }}
    secrets: inherit

  anomstream:
    name: anomstream
    needs: [plan]
    if: needs.plan.outputs.anomstream_selected == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-anomstream.yml
    with:
      version: ${{ needs.plan.outputs.anomstream_version }}
      ref: ${{ needs.plan.outputs.anomstream_ref }}
      publish: ${{ !inputs.dry-run }}
    secrets: inherit

  # ── The one release we publish ────────────────────────────────────
  publish:
    name: Publish ${{ inputs.release }}
    needs: [plan, ebpfsentinel, enterprise, operator, dashboard, anomstream]
    # A component the `only` filter excluded is skipped, and a skipped
    # dependency would skip this job under the default rule. Failures and
    # cancellations still stop the release. A dry run built everything and
    # pushed none of it, so there is nothing here to verify or publish.
    if: >-
      always()
      && needs.plan.result == 'success'
      && !inputs.dry-run
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write # the one release we publish
      packages: read # reading back the digests of what was just pushed
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: metadata

      # Only components that declare binaries produce a bundle. An image-only or
      # crates-only component has nothing to attach, and its absence here is
      # expected rather than a failure: the check below is against the manifest,
      # not against the artifact list.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          pattern: "*-bundle"
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          pattern: "*-bundle-signatures"
          merge-multiple: true

      - name: Check every declared tarball was produced
        run: |
          set -euo pipefail
          missing=0
          while IFS="$(printf '\t')" read -r _repo _version tarball _bin _arch; do
            [ -z "$tarball" ] && continue
            if [ ! -f "assets/${tarball}" ]; then
              echo "::error::${tarball} is declared in the manifest but no build produced it"
              missing=1
            fi
          done < metadata/binaries.tsv
          [ "$missing" -eq 0 ] || exit 1
          ls -la assets

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The manifest is the inventory issue-measurements.yml will sign, so an
      # image it names that nothing pushed would be discovered after the release
      # was public. Components excluded by `only` are checked too: their images
      # come from an earlier run and must still be in the registry at this tag.
      - name: Check every declared image exists
        run: |
          set -euo pipefail
          missing=0
          while read -r image; do
            [ -z "$image" ] && continue
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "ok  ${image}"
            else
              echo "::error::${image} is declared in the manifest but is not in the registry"
              missing=1
            fi
          done < metadata/images.tsv
          [ "$missing" -eq 0 ] || exit 1

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REL: ${{ inputs.release }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          cp "metadata/releases/${REL}.yaml" "assets/release-${REL}.yaml"
          args=(--title "eBPFsentinel ${REL}" --notes-file metadata/release-notes.md)
          if [ "$DRAFT" = "true" ]; then
            args+=(--draft)
          fi

          if gh release view "v${REL}" >/dev/null 2>&1; then
            echo "v${REL} exists, replacing its assets"
            gh release upload "v${REL}" assets/* --clobber
            gh release edit "v${REL}" "${args[@]}"
          else
            gh release create "v${REL}" assets/* "${args[@]}"
          fi

      - name: Next step
        env:
          REL: ${{ inputs.release }}
        run: |
          set -euo pipefail
          {
            echo "### eBPFsentinel ${REL} cut"
            echo
            echo "Release drafted at https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${REL}"
            echo
            echo "Now run **Issue measurements** for \`${REL}\` to produce the signed inventory."
          } >> "$GITHUB_STEP_SUMMARY"
