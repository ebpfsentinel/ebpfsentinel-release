# Publishes the anomstream crates to crates.io from THIS repository.
#
# anomstream ships as crates and nothing else: there is no tarball and no
# image, so this workflow produces no bundle for the release to attach. What it
# produces is four published versions and a provenance attestation over the
# packaged .crate files.
#
# The gates below are re-run here rather than trusted from the component's own
# `ci.yml`, unlike every other component. A crates.io publish cannot be undone
# (only yanked), so the last thing to touch the tree before publication should
# be the thing that checked it.
name: build-anomstream

on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish (YYYY.M.X)"
        required: true
        type: string
      ref:
        description: "Commit sha in ebpfsentinel/anomstream to publish"
        required: true
        type: string
      publish:
        description: "Publish to crates.io (off for a dry run)"
        required: false
        default: true
        type: boolean

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ebpfsentinel/anomstream
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.COMPONENT_CHECKOUT_TOKEN || github.token }}

      # Stamps the workspace Cargo.toml files and the README `cargo add`
      # snippets, so the gates run against the tree that will actually be
      # published rather than against the 0.0.0-dev placeholder.
      - uses: ./src/.github/actions/stamp-version
        with:
          version: ${{ inputs.version }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          shared-key: anomstream-release

      - name: cargo fmt
        working-directory: src
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: src
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        working-directory: src
        run: cargo test --workspace

      # no_std compatibility is a published promise of these crates, and it
      # breaks silently: a std-only dependency added under a default feature
      # compiles fine everywhere else.
      - name: cargo test (no default features)
        working-directory: src
        run: cargo test --workspace --no-default-features

      - name: Install cargo-audit and cargo-deny
        run: cargo install --locked cargo-audit cargo-deny

      - name: cargo audit
        working-directory: src
        run: cargo audit

      - name: cargo deny
        working-directory: src
        run: cargo deny check

  publish-dry-run:
    name: cargo publish --dry-run
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ebpfsentinel/anomstream
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.COMPONENT_CHECKOUT_TOKEN || github.token }}

      - uses: ./src/.github/actions/stamp-version
        with:
          version: ${{ inputs.version }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          shared-key: anomstream-release

      # Only anomstream-core can dry-run before first publication: the other
      # members depend on it by version string, and cargo's dry-run resolves
      # that against crates.io. After core's first publish, expand to the full
      # chain in dependency order: core -> triage -> hotpath -> anomstream.
      - uses: ./src/.github/actions/cargo-publish-dry-run
        with:
          package: anomstream-core

  crates-publish:
    name: cargo publish (crates.io)
    needs: [verify, publish-dry-run]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless build-provenance attestation
      attestations: write
    # Static CARGO_REGISTRY_TOKEN scoped to the `crates-io` environment,
    # generated at https://crates.io/settings/tokens with `publish-new` +
    # `publish-update`. The environment also carries the manual approval gate
    # when "Required reviewers" is configured for it.
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ebpfsentinel/anomstream
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.COMPONENT_CHECKOUT_TOKEN || github.token }}

      - uses: ./src/.github/actions/stamp-version
        with:
          version: ${{ inputs.version }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          shared-key: anomstream-release

      # Dependency order, one version across all four members. Since 1.66
      # `cargo publish` waits for the just-published crate to appear in the
      # index before exiting, so the chain needs no sleeps even on a first
      # release. --allow-dirty because the version was stamped in-tree and
      # never committed.
      #
      # If a member's version already exists on crates.io the run fails fast
      # ("crate version is already uploaded"): bump the version in the release
      # manifest and re-run.
      - name: Publish
        working-directory: src
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euxo pipefail
          cargo publish -p anomstream-core    --allow-dirty
          cargo publish -p anomstream-triage  --allow-dirty
          cargo publish -p anomstream-hotpath --allow-dirty
          cargo publish -p anomstream         --allow-dirty

      # Verifiable with `gh attestation verify <file>.crate --owner ebpfsentinel`.
      - name: Attest crate provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: src/target/package/*.crate
