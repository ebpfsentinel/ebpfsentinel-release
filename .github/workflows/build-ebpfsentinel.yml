# Builds, pushes and signs the OSS agent from THIS repository.
#
# The component repository holds the source and its own `ci.yml`; it does not
# build releases. Everything a customer can download or pull is produced here,
# from the commit `releases/<version>.yaml` pins, so the signed inventory and
# the artifacts it describes cannot drift apart.
#
# Called by cut-release.yml. Every artifact name is prefixed `ebpfsentinel-`
# because a release run builds five components into one shared artifact scope.
name: build-ebpfsentinel

on:
  workflow_call:
    inputs:
      version:
        description: "Version to stamp and publish (YYYY.M.X)"
        required: true
        type: string
      ref:
        description: "Commit sha in ebpfsentinel/ebpfsentinel to build"
        required: true
        type: string
      push:
        description: "Push images and charts to GHCR (off for a dry run)"
        required: false
        default: true
        type: boolean
    outputs:
      bundle-artifact:
        description: "Artifact holding the release tarballs"
        value: ebpfsentinel-bundle

permissions: {}

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  # The component repository, not this one. It is what
  # org.opencontainers.image.source must point at: a reader following that
  # label wants the code, not the release plumbing.
  COMPONENT_REPO: ebpfsentinel/ebpfsentinel
  IMAGE: ghcr.io/ebpfsentinel/ebpfsentinel
  WARDEN_IMAGE: ghcr.io/ebpfsentinel/ebpfsentinel-warden
  IMAGE_DESCRIPTION: High-performance eBPF network security agent
  WARDEN_DESCRIPTION: Privileged kernel-operation control plane for a rootless eBPFsentinel agent
  LICENSE: AGPL-3.0-only

jobs:
  # ── Release tarballs, one per architecture ────────────────────────
  build-release:
    name: Build ${{ inputs.version }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      # `path: src` throughout: the source is a checkout this repository makes,
      # not the repository the workflow lives in.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ebpfsentinel/ebpfsentinel
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.COMPONENT_CHECKOUT_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          shared-key: ebpfsentinel-release-${{ matrix.arch }}

      - name: Install system dependencies
        # No llvm-dev here: the LLVM bpf-linker links against is pinned, and
        # installed by the install-bpf-linker action below. Installing the
        # distribution's on top of it puts a second, older llvm-config on the
        # PATH, which is what the action's own prefix pin exists to ignore.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler musl-tools flex bison wget cmake libpcap-dev

      - name: Build static libpcap (musl)
        run: |
          PCAP_VERSION=1.10.6
          PCAP_SHA256="ec97d1206bdd19cb6bdd043eaa9f0037aa732262ec68e070fd7c7b5f834d5dfc"
          wget -qO /tmp/libpcap.tar.xz "https://www.tcpdump.org/release/libpcap-${PCAP_VERSION}.tar.xz"
          echo "${PCAP_SHA256}  /tmp/libpcap.tar.xz" | sha256sum -c -
          tar xJf /tmp/libpcap.tar.xz -C /tmp && rm -f /tmp/libpcap.tar.xz
          # Symlink Linux kernel headers into the musl include path so configure
          # finds linux/if_packet.h and asm/types.h (required for packet capture
          # detection). On Ubuntu the arch-specific headers live under
          # /usr/include/<triple>/.
          MUSL_INC=/usr/local/musl/include
          ARCH_INC="/usr/include/$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          sudo mkdir -p "$MUSL_INC"
          sudo ln -sf /usr/include/linux "$MUSL_INC/linux"
          sudo ln -sf /usr/include/asm-generic "$MUSL_INC/asm-generic"
          sudo ln -sf "$ARCH_INC/asm" "$MUSL_INC/asm"
          cd "/tmp/libpcap-${PCAP_VERSION}"
          CC=musl-gcc CFLAGS="-I/usr/local/musl/include" ./configure --disable-shared --prefix=/usr/local/musl
          make -j"$(nproc)"
          sudo make install

      # The composite actions stay in the component repository and are used
      # from the checkout. Copying them here would give two definitions of one
      # build step, and the copy is the one that rots.
      - uses: ./src/.github/actions/install-bpf-linker

      - uses: ./src/.github/actions/stamp-version
        with:
          version: ${{ inputs.version }}

      - name: Build eBPF programs
        working-directory: src
        run: cargo xtask ebpf-build

      - name: Build release binaries
        working-directory: src
        env:
          LIBPCAP_LIBDIR: /usr/local/musl/lib
          RUSTFLAGS: "-L native=/usr/local/musl/lib"
        run: cargo build --release --target ${{ matrix.target }} --bin ebpfsentinel-agent --bin warden

      # The OpenAPI `info.version` derives from CARGO_PKG_VERSION, which
      # stamp-version just rewrote. Architecture-independent, so emit once.
      - name: Generate OpenAPI spec
        if: matrix.arch == 'amd64'
        working-directory: src
        run: cargo xtask emit-openapi --output openapi.json

      - name: Upload OpenAPI spec
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ebpfsentinel-openapi
          path: src/openapi.json
          retention-days: 30

      - name: Create release tarball
        working-directory: src
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          STAGING="ebpfsentinel-${VERSION}-linux-${ARCH}"
          mkdir -p "${STAGING}/ebpf"
          cp "target/${TARGET}/release/ebpfsentinel-agent" "${STAGING}/"
          cp "target/${TARGET}/release/warden" "${STAGING}/"
          cp config/ebpfsentinel.yaml "${STAGING}/"
          cp dist/ebpfsentinel-warden.service "${STAGING}/"
          cp dist/ebpfsentinel.service "${STAGING}/"
          cp dist/install.sh "${STAGING}/"
          # install.sh reads both of these on hosts that gate unprivileged user
          # namespaces behind AppArmor (Ubuntu 24.04 and up): the per-binary
          # profile when apparmor_parser is present, the sysctl drop-in when it
          # is not. Ship them or the agent cannot unshare the namespace it loads
          # its eBPF in. The seccomp profile is deliberately absent: it applies
          # to the container deployment, not to a systemd unit.
          cp -a dist/apparmor.d "${STAGING}/"
          cp -a dist/sysctl.d "${STAGING}/"
          cp LICENSE "${STAGING}/"
          cp target/bpfel-unknown-none/release/* "${STAGING}/ebpf/"
          tar czf "${STAGING}.tar.gz" "${STAGING}"
          echo "TARBALL=src/${STAGING}.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ebpfsentinel-release-${{ matrix.arch }}
          path: ${{ env.TARBALL }}
          retention-days: 30

  # ── One artifact for the signer and the publisher ─────────────────
  bundle:
    name: Bundle artifacts
    needs: [build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bundle
          pattern: ebpfsentinel-release-*
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ebpfsentinel-openapi
          path: bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ebpfsentinel-bundle
          path: bundle/
          retention-days: 7

  # Signing keeps the full remote form even though the workflow lives in this
  # repository: Sigstore records the CALLED ref as the certificate subject, and
  # `./.github/workflows/sign-blob.yml` would record @refs/heads/main. Every
  # published policy pins @refs/tags/v*, so a local call would break
  # verification for every customer.
  sign-blobs:
    name: Sign blobs
    needs: [bundle]
    permissions:
      id-token: write
      contents: read
      attestations: write
    uses: ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-blob.yml@v1
    with:
      artifact-name: ebpfsentinel-bundle

  # ── eBPF objects for the agent image, built once ──────────────────
  # The output is architecture-independent (bpfel-unknown-none), so building it
  # per platform would burn a nightly toolchain twice for identical bytes.
  build-ebpf:
    name: Build eBPF
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ebpfsentinel/ebpfsentinel
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.COMPONENT_CHECKOUT_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          shared-key: ebpfsentinel-ebpf

      - uses: ./src/.github/actions/install-bpf-linker

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpcap-dev

      - uses: ./src/.github/actions/stamp-version
        with:
          version: ${{ inputs.version }}

      - name: Build eBPF programs
        working-directory: src
        run: |
          set -euo pipefail
          cargo xtask ebpf-build
          mkdir -p ebpf-out
          cp target/bpfel-unknown-none/release/* ebpf-out/
          ls -la ebpf-out/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ebpfsentinel-ebpf-programs
          path: src/ebpf-out/
          retention-days: 7

  # ── Per-platform images ───────────────────────────────────────────
  #
  # Two images per platform, because a deployment needs both halves. The agent
  # image is the rootless agent alone: every capability dropped, its own user
  # namespace, its eBPF loaded through a token against a bpffs the warden
  # delegated to it. Publish only the agent and every install path reaches
  # API-only mode and attaches nothing.
  build-images:
    name: Image ${{ matrix.component }} (${{ matrix.platform }})
    needs: [build-ebpf]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [agent, warden]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - component: agent
            dockerfile: Dockerfile.agent
            suffix: ""
            title: eBPFsentinel
          - component: warden
            dockerfile: Dockerfile.warden
            suffix: "-warden"
            title: eBPFsentinel-warden
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ebpfsentinel/ebpfsentinel
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.COMPONENT_CHECKOUT_TOKEN || github.token }}

      # Into the build context: Dockerfile.agent copies ebpf-out/ verbatim.
      # Only the agent image carries the programs; the warden loads no eBPF and
      # holds no maps.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.component == 'agent'
        with:
          name: ebpfsentinel-ebpf-programs
          path: src/ebpf-out/

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract platform architecture
        run: echo "PLATFORM_ARCH=${platform##*/}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: ./src/.github/actions/stamp-version
        with:
          version: ${{ inputs.version }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}${{ matrix.suffix }}
          tags: |
            type=raw,value=${{ inputs.version }}-${{ env.PLATFORM_ARCH }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.component == 'agent' && env.IMAGE_DESCRIPTION || env.WARDEN_DESCRIPTION }} (${{ env.PLATFORM_ARCH }})
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.vendor=eBPFsentinel
            org.opencontainers.image.licenses=${{ env.LICENSE }}
            org.opencontainers.image.source=https://github.com/${{ env.COMPONENT_REPO }}
            org.opencontainers.image.documentation=https://github.com/ebpfsentinel/ebpfsentinel-docs
            org.opencontainers.image.revision=${{ inputs.ref }}

      - name: Build and push platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: src
          file: src/${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.push }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ inputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ebpfsentinel-${{ matrix.component }}-${{ env.PLATFORM_ARCH }}
          cache-to: type=gha,scope=ebpfsentinel-${{ matrix.component }}-${{ env.PLATFORM_ARCH }},mode=max
          outputs: type=image,oci-mediatypes=true

  # ── Multi-arch manifests ──────────────────────────────────────────
  #
  # Both images in one job rather than a matrix: the signing jobs below need a
  # digest per image, and matrix job outputs are last-writer-wins.
  create-manifest:
    name: Multi-arch manifests
    needs: [build-images]
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      agent_image: ${{ steps.manifests.outputs.agent_image }}
      agent_digest: ${{ steps.manifests.outputs.agent_digest }}
      warden_image: ${{ steps.manifests.outputs.warden_image }}
      warden_digest: ${{ steps.manifests.outputs.warden_digest }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Create and push multi-arch manifests
        id: manifests
        env:
          VERSION: ${{ inputs.version }}
          AGENT_IMAGE: ${{ env.IMAGE }}
          WARDEN_IMAGE: ${{ env.WARDEN_IMAGE }}
          AGENT_DESCRIPTION: ${{ env.IMAGE_DESCRIPTION }}
          WARDEN_DESCRIPTION: ${{ env.WARDEN_DESCRIPTION }}
          SOURCE: https://github.com/${{ env.COMPONENT_REPO }}
          LICENSE: ${{ env.LICENSE }}
        run: |
          set -euo pipefail
          for component in agent warden; do
            case "$component" in
              agent)  image="${AGENT_IMAGE}";  description="${AGENT_DESCRIPTION}" ;;
              warden) image="${WARDEN_IMAGE}"; description="${WARDEN_DESCRIPTION}" ;;
            esac

            docker buildx imagetools create \
              -t "${image}:${VERSION}" \
              -t "${image}:latest" \
              --annotation="index:org.opencontainers.image.description=${description}" \
              --annotation="index:org.opencontainers.image.source=${SOURCE}" \
              --annotation="index:org.opencontainers.image.licenses=${LICENSE}" \
              "${image}:${VERSION}-amd64" \
              "${image}:${VERSION}-arm64"

            digest="$(docker buildx imagetools inspect "${image}:${VERSION}" --format '{{.Manifest.Digest}}')"
            echo "${component}_image=${image}" >> "$GITHUB_OUTPUT"
            echo "${component}_digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "${component}: ${image}@${digest}"
          done

  # cosign keyless signature + SBOM of each multi-arch manifest. Both images are
  # admission-gated, so an unsigned warden would block the agent it has to serve.
  sign:
    name: Sign agent image
    needs: [create-manifest]
    permissions:
      id-token: write
      packages: write
      contents: read
    uses: ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@v1
    with:
      image: ${{ needs.create-manifest.outputs.agent_image }}
      digest: ${{ needs.create-manifest.outputs.agent_digest }}

  sign-warden:
    name: Sign warden image
    needs: [create-manifest]
    permissions:
      id-token: write
      packages: write
      contents: read
    uses: ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@v1
    with:
      image: ${{ needs.create-manifest.outputs.warden_image }}
      digest: ${{ needs.create-manifest.outputs.warden_digest }}

  # ── Helm chart, stamped with the version of the image it deploys ──
  helm:
    name: Helm chart
    needs: [create-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ebpfsentinel/ebpfsentinel
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.COMPONENT_CHECKOUT_TOKEN || github.token }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Stamp version in Chart.yaml
        working-directory: src
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^version: .*/version: ${VERSION}/" charts/ebpfsentinel/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" charts/ebpfsentinel/Chart.yaml
          grep -E '^(version|appVersion):' charts/ebpfsentinel/Chart.yaml

      - name: Lint chart
        working-directory: src
        run: helm lint charts/ebpfsentinel/

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package chart
        working-directory: src
        run: helm package charts/ebpfsentinel/

      - name: Push chart to GHCR
        id: push
        working-directory: src
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          helm push "ebpfsentinel-${VERSION}.tgz" "oci://ghcr.io/ebpfsentinel/charts" 2>&1 | tee push.log
          DIGEST="$(grep -oiE 'sha256:[0-9a-f]{64}' push.log | head -1)"
          if [ -z "$DIGEST" ]; then
            echo "::error::could not parse the pushed chart digest from helm output"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/ebpfsentinel/charts/ebpfsentinel" >> "$GITHUB_OUTPUT"

  # No SBOM: syft produces nothing meaningful for a Helm chart.
  sign-helm:
    name: Sign chart
    needs: [helm]
    permissions:
      id-token: write
      packages: write
      contents: read
    uses: ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@v1
    with:
      image: ${{ needs.helm.outputs.image }}
      digest: ${{ needs.helm.outputs.digest }}
      sbom: false
