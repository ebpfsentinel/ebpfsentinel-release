# Reusable workflow: cosign-keyless sign a pushed container image + attest SBOM.
#
# Called by every image-producing repo AFTER `docker/build-push-action`
# (which must run with `provenance: true` so the SLSA build provenance is
# already attached to the digest by BuildKit). This workflow adds the
# cosign signature and an SPDX SBOM attestation, both keyless (Sigstore
# Fulcio/Rekor) — no private key is stored anywhere.
#
# Trust anchor for verification (see policy/):
#   issuer:   https://token.actions.githubusercontent.com
#   identity: https://github.com/ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@refs/tags/v*
#   source:   the calling repository, recorded in the Fulcio certificate as
#             the GitHub Workflow Repository extension (OID 1.3.6.1.4.1.57264.1.5)
#
# IMPORTANT — reusable-workflow identity: Sigstore records the *called*
# workflow ref as the certificate subject, so any repository on GitHub that
# calls this public workflow would obtain a certificate carrying OUR identity.
# The `Authorize caller repository` gate below is what prevents that: it fails
# the job before any OIDC token is exchanged for a signing certificate.
# Verifiers must ALSO pin the caller (see policy/verify.sh, policy/*.yaml).
name: sign-image

on:
  workflow_call:
    inputs:
      image:
        description: "Image ref WITHOUT tag, e.g. ghcr.io/ebpfsentinel/ebpfsentinel-dashboard"
        required: true
        type: string
      digest:
        description: "Image digest, e.g. sha256:abc123..."
        required: true
        type: string
      sbom:
        description: "Generate and attest an SPDX SBOM"
        required: false
        default: true
        type: boolean

permissions: {}

env:
  # Repositories allowed to borrow this signing identity. Keep in sync with
  # ALLOWED_SOURCE_REPOS in policy/verify.sh and the attestor entries in
  # policy/kyverno-verify-images.yaml.
  ALLOWED_CALLERS: |
    ebpfsentinel/ebpfsentinel
    ebpfsentinel/ebpfsentinel-enterprise
    ebpfsentinel/ebpfsentinel-operator
    ebpfsentinel/ebpfsentinel-dashboard
    ebpfsentinel/ebpfsentinel-release

jobs:
  sign:
    name: Sign & attest
    runs-on: ubuntu-latest
    permissions:
      id-token: write # keyless OIDC signing identity
      packages: write # push signature + attestation to GHCR
      contents: read
    steps:
      # In a reusable workflow `github.repository` is the CALLER's repository.
      # Runs before any signing step so an unauthorized caller never reaches
      # the OIDC token exchange.
      - name: Authorize caller repository
        env:
          CALLER: ${{ github.repository }}
        run: |
          if ! printf '%s\n' "$ALLOWED_CALLERS" | grep -qxF "$CALLER"; then
            echo "::error::repository '$CALLER' is not authorized to use the eBPFsentinel release signing identity"
            exit 1
          fi
          echo "caller authorized: $CALLER"

      - name: Validate digest
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          if ! echo "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::digest must be 'sha256:<64 hex>', got: $DIGEST"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Sign image (keyless)
        env:
          REF: ${{ inputs.image }}@${{ inputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Generate SBOM (SPDX)
        if: ${{ inputs.sbom }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ inputs.image }}@${{ inputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM (keyless)
        if: ${{ inputs.sbom }}
        env:
          REF: ${{ inputs.image }}@${{ inputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
