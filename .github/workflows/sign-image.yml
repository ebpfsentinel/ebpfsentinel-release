# Reusable workflow: cosign-keyless sign a pushed container image + attest SBOM.
#
# Called by every image-producing repo AFTER `docker/build-push-action`
# (which must run with `provenance: true` so the SLSA build provenance is
# already attached to the digest by BuildKit). This workflow adds the
# cosign signature and an SPDX SBOM attestation, both keyless (Sigstore
# Fulcio/Rekor) — no private key is stored anywhere.
#
# Trust anchor for verification (see policy/):
#   issuer:   https://token.actions.githubusercontent.com
#   identity: https://github.com/ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@refs/tags/v*
#   source:   the calling repository, recorded in the Fulcio certificate as
#             the GitHub Workflow Repository extension (OID 1.3.6.1.4.1.57264.1.5)
#
# IMPORTANT — reusable-workflow identity: Sigstore records the *called*
# workflow ref as the certificate subject, so any repository on GitHub that
# calls this public workflow would obtain a certificate carrying OUR identity.
# The `Authorize caller repository` gate below is what prevents that: it fails
# the job before any OIDC token is exchanged for a signing certificate.
# Verifiers must ALSO pin the caller (see policy/verify.sh, policy/*.yaml).
name: sign-image

on:
  workflow_call:
    inputs:
      image:
        description: "Image ref WITHOUT tag, e.g. ghcr.io/ebpfsentinel/ebpfsentinel-dashboard"
        required: true
        type: string
      digest:
        description: "Image digest, e.g. sha256:abc123..."
        required: true
        type: string
      sbom:
        description: "Generate and attest an SPDX SBOM"
        required: false
        default: true
        type: boolean
      vuln-scan:
        description: "Scan the image and attest the result (a dated statement of what we knew at release time)"
        required: false
        default: true
        type: boolean
      vex:
        description: "Attach the OpenVEX statements curated in ebpfsentinel-release/vex/, if any exist for this component"
        required: false
        default: true
        type: boolean

permissions: {}

env:
  # Repositories allowed to borrow this signing identity. Keep in sync with
  # ALLOWED_SOURCE_REPOS in policy/verify.sh and the attestor entries in
  # policy/kyverno-verify-images.yaml.
  ALLOWED_CALLERS: |
    ebpfsentinel/ebpfsentinel
    ebpfsentinel/ebpfsentinel-enterprise
    ebpfsentinel/ebpfsentinel-operator
    ebpfsentinel/ebpfsentinel-dashboard
    ebpfsentinel/ebpfsentinel-release

jobs:
  sign:
    name: Sign & attest
    runs-on: ubuntu-latest
    permissions:
      id-token: write # keyless OIDC signing identity
      packages: write # push signature + attestation to GHCR
      contents: read
    steps:
      # In a reusable workflow `github.repository` is the CALLER's repository.
      # Runs before any signing step so an unauthorized caller never reaches
      # the OIDC token exchange.
      - name: Authorize caller repository
        env:
          CALLER: ${{ github.repository }}
        run: |
          if ! printf '%s\n' "$ALLOWED_CALLERS" | grep -qxF "$CALLER"; then
            echo "::error::repository '$CALLER' is not authorized to use the eBPFsentinel release signing identity"
            exit 1
          fi
          echo "caller authorized: $CALLER"

      - name: Validate image ref and digest
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        run: |
          if ! printf '%s' "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::digest must be 'sha256:<64 hex>', got: $DIGEST"
            exit 1
          fi
          # Registry/path only — no tag, no digest, no shell metacharacters.
          if ! printf '%s' "$IMAGE" | grep -qE '^[a-z0-9.-]+(:[0-9]+)?(/[a-z0-9._-]+)+$'; then
            echo "::error::image must be a tagless registry path, e.g. ghcr.io/ebpfsentinel/ebpfsentinel; got: $IMAGE"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        env:
          REF: ${{ inputs.image }}@${{ inputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Generate SBOM (SPDX)
        if: ${{ inputs.sbom }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ inputs.image }}@${{ inputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM (keyless)
        if: ${{ inputs.sbom }}
        env:
          REF: ${{ inputs.image }}@${{ inputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

      # An SBOM says what is inside. It does not say whether any of it is known
      # to be vulnerable, and a customer cannot answer that later without
      # knowing what we knew *at release time* — hence a dated, signed scan.
      - name: Scan image for vulnerabilities
        if: ${{ inputs.vuln-scan }}
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ inputs.image }}@${{ inputs.digest }}
          output-format: json
          # Never gate the signature on the scan result: an unsigned image that
          # ships anyway is strictly worse than a signed one with a known CVE
          # recorded against it. Release gating belongs in the product repo.
          fail-build: false
          severity-cutoff: negligible

      - name: Attest scan result (keyless)
        if: ${{ inputs.vuln-scan }}
        env:
          REF: ${{ inputs.image }}@${{ inputs.digest }}
          REPORT: ${{ steps.scan.outputs.json }}
        run: |
          if [ ! -s "$REPORT" ]; then
            echo "::error::vulnerability scan produced no report"
            exit 1
          fi
          cosign attest --yes --type vuln --predicate "$REPORT" "$REF"

      # VEX turns "this CVE is present" into "and here is whether it can be
      # reached". Statements are curated in the release repo, reviewed by the
      # release owners, and pinned to this exact digest at attach time.
      - name: Fetch curated VEX statements
        if: ${{ inputs.vex }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ebpfsentinel/ebpfsentinel-release
          ref: v1
          path: .release-policy

      - name: Attest VEX (keyless)
        if: ${{ inputs.vex }}
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        run: |
          COMPONENT="${IMAGE##*/}"
          SRC=".release-policy/vex/${COMPONENT}.openvex.json"
          if [ ! -f "$SRC" ]; then
            echo "::notice::no curated VEX statements for ${COMPONENT} — nothing to assert"
            exit 0
          fi
          # Statements are authored against the component; only here do we know
          # the digest they apply to.
          jq --arg purl "pkg:oci/${COMPONENT}@${DIGEST}" \
             --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '.timestamp = $now
              | .statements = [ .statements[] | .products = [ { "@id": $purl } ] ]' \
             "$SRC" > vex.openvex.json
          python3 .release-policy/scripts/check-vex.py vex.openvex.json
          cosign attest --yes --type openvex --predicate vex.openvex.json \
            "${IMAGE}@${DIGEST}"
