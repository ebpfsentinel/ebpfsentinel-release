# Builds, pushes and signs the Kubernetes operator and its Helm chart from
# THIS repository.
#
# One image: every kind compiles in, and the operator refuses to start without
# a licence carrying `kubernetes-operator`, so what a cluster reconciles is the
# licence's decision rather than a build's.
name: build-operator

on:
  workflow_call:
    secrets:
      SIBLING_READ_TOKEN:
        description: "Read token for the private operator repository"
        required: true
    inputs:
      version:
        description: "Version to stamp and publish (YYYY.M.X)"
        required: true
        type: string
      ref:
        description: "Commit sha in ebpfsentinel/ebpfsentinel-operator to build"
        required: true
        type: string
      push:
        description: "Push images to GHCR (off for a dry run)"
        required: false
        default: true
        type: boolean

permissions: {}

env:
  REGISTRY: ghcr.io
  COMPONENT_REPO: ebpfsentinel/ebpfsentinel-operator
  IMAGE: ghcr.io/ebpfsentinel/ebpfsentinel-operator
  CHART_PATH: charts/ebpfsentinel-operator
  CHART_IMAGE: ghcr.io/ebpfsentinel/charts/ebpfsentinel-operator
  LICENSE: LicenseRef-Proprietary

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      # Through a step rather than straight from `env`: the env context is not
      # available in job outputs.
      image: ${{ steps.names.outputs.image }}
    steps:
      - name: Image name
        id: names
        env:
          IMAGE: ${{ env.IMAGE }}
        run: echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      # Before the registry login: a malformed version would otherwise be
      # discovered only after the image had been pushed under a bad tag.
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]{4}\.[1-9][0-9]?\.[0-9]+$'; then
            echo "::error::Invalid version format: $VERSION (expected YYYY.M.X)"
            exit 1
          fi

      # The operator's repository is private, so GITHUB_TOKEN cannot read it
      # from here, and a checkout missing its token reports only `Input required
      # and not supplied: token`, naming neither the secret nor the repository.
      - name: Refuse to run without the token the operator checkout needs
        env:
          SIBLING_READ_TOKEN: ${{ secrets.SIBLING_READ_TOKEN }}
        run: |
          if [[ -z "${SIBLING_READ_TOKEN}" ]]; then
            echo "::error::SIBLING_READ_TOKEN is not configured, so ebpfsentinel/ebpfsentinel-operator cannot be checked out and no operator image or chart can be built. Add a repository secret holding a token with read access to the contents of ebpfsentinel/ebpfsentinel-operator. It is the one token every repository in this project uses to read a private sibling, so grant it read on all of them at once rather than on this one."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ebpfsentinel/ebpfsentinel-operator
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.SIBLING_READ_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `type=sha` is deliberately absent: the run's own sha belongs to this
      # repository, not to the operator, and a tag pointing at a commit that
      # never built the image is worse than no tag. The commit that did build it
      # is on the revision label below.
      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=eBPFsentinel Operator
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.vendor=eBPFsentinel
            org.opencontainers.image.licenses=${{ env.LICENSE }}
            org.opencontainers.image.source=https://github.com/${{ env.COMPONENT_REPO }}
            org.opencontainers.image.revision=${{ inputs.ref }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          push: ${{ inputs.push }}
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  # cosign keyless signature + SBOM. The full remote form is deliberate: Sigstore records the CALLED ref as the certificate
  # subject, and every published policy pins @refs/tags/v*.
  sign:
    name: Sign and attest
    needs: [build-and-push]
    if: inputs.push
    permissions:
      id-token: write
      packages: write
      contents: read
    uses: ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@v1
    with:
      image: ${{ needs.build-and-push.outputs.image }}
      digest: ${{ needs.build-and-push.outputs.digest }}

  # The chart names the image by default. It carries the image's version and ships in the same run rather than behind a tag of
  # its own, so the chart a customer pulls never names an image that is absent.
  helm:
    name: Helm chart
    needs: [build-and-push]
    if: inputs.push
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      # The operator's repository is private, so GITHUB_TOKEN cannot read it
      # from here, and a checkout missing its token reports only `Input required
      # and not supplied: token`, naming neither the secret nor the repository.
      - name: Refuse to run without the token the operator checkout needs
        env:
          SIBLING_READ_TOKEN: ${{ secrets.SIBLING_READ_TOKEN }}
        run: |
          if [[ -z "${SIBLING_READ_TOKEN}" ]]; then
            echo "::error::SIBLING_READ_TOKEN is not configured, so ebpfsentinel/ebpfsentinel-operator cannot be checked out and no operator image or chart can be built. Add a repository secret holding a token with read access to the contents of ebpfsentinel/ebpfsentinel-operator. It is the one token every repository in this project uses to read a private sibling, so grant it read on all of them at once rather than on this one."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ebpfsentinel/ebpfsentinel-operator
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.SIBLING_READ_TOKEN }}

      - name: Stamp version in Chart.yaml
        working-directory: src
        env:
          VERSION: ${{ inputs.version }}
          CHART_PATH: ${{ env.CHART_PATH }}
        run: |
          set -euo pipefail
          sed -i "s/^version: .*/version: ${VERSION}/" "${CHART_PATH}/Chart.yaml"
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" "${CHART_PATH}/Chart.yaml"
          grep -E '^(version|appVersion):' "${CHART_PATH}/Chart.yaml"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Helm lint
        working-directory: src
        run: helm lint ${{ env.CHART_PATH }}

      - name: Helm template dry-run
        working-directory: src
        run: helm template test-release ${{ env.CHART_PATH }} > /dev/null

      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Package chart
        working-directory: src
        run: helm package ${{ env.CHART_PATH }} --destination .helm-pkg

      - name: Push to OCI registry
        id: push
        working-directory: src
        env:
          REGISTRY: ${{ env.REGISTRY }}
          CHART_IMAGE: ${{ env.CHART_IMAGE }}
        run: |
          set -euo pipefail
          helm push .helm-pkg/*.tgz "oci://${REGISTRY}/ebpfsentinel/charts" 2>&1 | tee push.log
          DIGEST="$(grep -oiE 'sha256:[0-9a-f]{64}' push.log | head -1)"
          if [ -z "$DIGEST" ]; then
            echo "::error::could not parse the pushed chart digest from helm output"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image=${CHART_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Upload chart package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operator-helm-chart
          path: src/.helm-pkg/*.tgz
          retention-days: 7

  # No SBOM: syft produces nothing meaningful for a Helm chart.
  sign-helm:
    name: Sign chart
    needs: [helm]
    permissions:
      id-token: write
      packages: write
      contents: read
    uses: ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@v1
    with:
      image: ${{ needs.helm.outputs.image }}
      digest: ${{ needs.helm.outputs.digest }}
      sbom: false
