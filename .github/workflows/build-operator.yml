# Builds, pushes and signs the Kubernetes operator from THIS repository.
#
# Two images out of one source tree: the same operator with and without
# `--features enterprise`. Both are published, because which one a cluster runs
# is a licensing decision made at deploy time, not a build we can skip.
name: build-operator

on:
  workflow_call:
    inputs:
      version:
        description: "Version to stamp and publish (YYYY.M.X)"
        required: true
        type: string
      ref:
        description: "Commit sha in ebpfsentinel/ebpfsentinel-operator to build"
        required: true
        type: string
      push:
        description: "Push images to GHCR (off for a dry run)"
        required: false
        default: true
        type: boolean

permissions: {}

env:
  REGISTRY: ghcr.io
  COMPONENT_REPO: ebpfsentinel/ebpfsentinel-operator
  IMAGE: ghcr.io/ebpfsentinel/ebpfsentinel-operator
  ENTERPRISE_IMAGE: ghcr.io/ebpfsentinel/ebpfsentinel-operator-enterprise
  LICENSE: AGPL-3.0-only

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest_oss: ${{ steps.build_oss.outputs.digest }}
      digest_enterprise: ${{ steps.build_ent.outputs.digest }}
      # Through a step rather than straight from `env`: the env context is not
      # available in job outputs.
      image_oss: ${{ steps.names.outputs.oss }}
      image_enterprise: ${{ steps.names.outputs.enterprise }}
    steps:
      - name: Image names
        id: names
        env:
          OSS: ${{ env.IMAGE }}
          ENTERPRISE: ${{ env.ENTERPRISE_IMAGE }}
        run: |
          echo "oss=${OSS}" >> "$GITHUB_OUTPUT"
          echo "enterprise=${ENTERPRISE}" >> "$GITHUB_OUTPUT"

      # Before the registry login: a malformed version would otherwise be
      # discovered only after two images had been pushed under a bad tag.
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]{4}\.[1-9][0-9]?\.[0-9]+$'; then
            echo "::error::Invalid version format: $VERSION (expected YYYY.M.X)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ebpfsentinel/ebpfsentinel-operator
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.COMPONENT_CHECKOUT_TOKEN || github.token }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `type=sha` is deliberately absent: the run's own sha belongs to this
      # repository, not to the operator, and a tag pointing at a commit that
      # never built the image is worse than no tag. The commit that did build it
      # is on the revision label below.
      - name: Metadata (oss)
        id: meta_oss
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=eBPFsentinel Operator
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.vendor=eBPFsentinel
            org.opencontainers.image.licenses=${{ env.LICENSE }}
            org.opencontainers.image.source=https://github.com/${{ env.COMPONENT_REPO }}
            org.opencontainers.image.revision=${{ inputs.ref }}

      - name: Build and push (oss)
        id: build_oss
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src
          push: ${{ inputs.push }}
          provenance: true
          tags: ${{ steps.meta_oss.outputs.tags }}
          labels: ${{ steps.meta_oss.outputs.labels }}
          # The Dockerfile switches on ENTERPRISE, not on a FEATURES string.
          build-args: |
            ENTERPRISE=false

      - name: Metadata (enterprise)
        id: meta_ent
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.ENTERPRISE_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=eBPFsentinel Operator (enterprise build)
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.vendor=eBPFsentinel
            org.opencontainers.image.licenses=${{ env.LICENSE }}
            org.opencontainers.image.source=https://github.com/${{ env.COMPONENT_REPO }}
            org.opencontainers.image.revision=${{ inputs.ref }}

      - name: Build and push (enterprise)
        id: build_ent
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src
          push: ${{ inputs.push }}
          provenance: true
          tags: ${{ steps.meta_ent.outputs.tags }}
          labels: ${{ steps.meta_ent.outputs.labels }}
          # Same tree, `--features enterprise` inside the builder stage. Without
          # this the two published images would be byte-identical builds under
          # two names, and the enterprise one would silently lack its features.
          build-args: |
            ENTERPRISE=true

  # cosign keyless signature + SBOM, one job per image variant. The full remote
  # form is deliberate: Sigstore records the CALLED ref as the certificate
  # subject, and every published policy pins @refs/tags/v*.
  sign:
    name: Sign and attest
    needs: [build-and-push]
    if: inputs.push
    permissions:
      id-token: write
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - image: ${{ needs.build-and-push.outputs.image_oss }}
            digest: ${{ needs.build-and-push.outputs.digest_oss }}
          - image: ${{ needs.build-and-push.outputs.image_enterprise }}
            digest: ${{ needs.build-and-push.outputs.digest_enterprise }}
    uses: ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@v1
    with:
      image: ${{ matrix.image }}
      digest: ${{ matrix.digest }}
