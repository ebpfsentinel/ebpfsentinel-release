# Reusable workflow: cosign-keyless sign release binaries / tarballs and
# emit a signed SHA256SUMS + GitHub build-provenance attestation.
#
# The caller uploads the files to sign as an artifact (same workflow run),
# then calls this with `artifact-name`. This workflow downloads them, signs
# each blob keyless, writes + signs SHA256SUMS, attaches provenance, and
# re-uploads the signatures as `<artifact-name>-signatures` for the caller
# to publish alongside the release assets.
#
# Trust anchor for verification (see policy/):
#   issuer:   https://token.actions.githubusercontent.com
#   identity: https://github.com/ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-blob.yml@refs/tags/v*
#   source:   the calling repository, recorded in the Fulcio certificate as
#             the GitHub Workflow Repository extension (OID 1.3.6.1.4.1.57264.1.5)
#
# IMPORTANT — reusable-workflow identity: Sigstore records the *called*
# workflow ref as the certificate subject, so any repository on GitHub that
# calls this public workflow would obtain a certificate carrying OUR identity.
# Blobs are the sharper edge of that flaw: unlike images they are not scoped to
# a registry namespace we control, so a rogue caller could hand a customer a
# tarball that passes `verify.sh`. The `Authorize caller repository` gate below
# fails the job before any OIDC token is exchanged; verifiers must ALSO pin the
# caller repository (see policy/verify.sh).
name: sign-blob

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name of the uploaded artifact holding the files to sign"
        required: true
        type: string
      pattern:
        description: "Glob of files to sign, relative to the artifact root"
        required: false
        default: "*"
        type: string

permissions: {}

env:
  # Repositories allowed to borrow this signing identity. Everything a customer
  # can pull is now built by cut-release.yml in this repository, so this list is
  # one entry: a component repository has nothing left to sign. Keep in sync
  # with ALLOWED_SOURCE_REPOS in policy/verify.sh and
  # .github/workflows/sign-image.yml.
  ALLOWED_CALLERS: |
    ebpfsentinel/ebpfsentinel-release

jobs:
  sign:
    name: Sign blobs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # keyless OIDC + provenance attestation
      contents: read
      attestations: write
    steps:
      # In a reusable workflow `github.repository` is the CALLER's repository.
      # Runs before any signing step so an unauthorized caller never reaches
      # the OIDC token exchange.
      - name: Authorize caller repository
        env:
          CALLER: ${{ github.repository }}
        run: |
          if ! printf '%s\n' "$ALLOWED_CALLERS" | grep -qxF "$CALLER"; then
            echo "::error::repository '$CALLER' is not authorized to use the eBPFsentinel release signing identity"
            exit 1
          fi
          echo "caller authorized: $CALLER"

      # Both inputs come from a caller workflow and flow into shell globbing,
      # an artifact name and an action input. Constrain them to an inert
      # charset here rather than reasoning about each use site.
      - name: Validate inputs
        env:
          ARTIFACT: ${{ inputs.artifact-name }}
          PATTERN: ${{ inputs.pattern }}
        run: |
          if ! printf '%s' "$ARTIFACT" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'; then
            echo "::error::artifact-name must match ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}\$, got: $ARTIFACT"
            exit 1
          fi
          if ! printf '%s' "$PATTERN" | grep -qE '^[A-Za-z0-9._*?/-]{1,200}$'; then
            echo "::error::pattern may only contain [A-Za-z0-9._*?/-], got: $PATTERN"
            exit 1
          fi
          case "$PATTERN" in
            */../* | ../* | */..) echo "::error::pattern must not traverse upwards"; exit 1 ;;
          esac

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign blobs + checksums (keyless)
        id: sign
        working-directory: dist
        env:
          PATTERN: ${{ inputs.pattern }}
        run: |
          # `compgen -G` expands the pattern as ONE word, so a release asset
          # whose name contains a space stays a single entry instead of being
          # word-split into two nonexistent paths.
          # Snapshot the file list BEFORE creating SHA256SUMS / *.sig.
          mapfile -t files < <(compgen -G "$PATTERN" || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no files matched pattern '$PATTERN'"
            exit 1
          fi
          : > SHA256SUMS
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            case "$f" in
              *$'\n'*) echo "::error::refusing to sign a filename containing a newline: $f"; exit 1 ;;
            esac
            echo "Signing $f"
            # --bundle carries sig+cert+Rekor inclusion proof so the blob can
            # be verified air-gapped (cosign verify-blob --offline --bundle).
            cosign sign-blob --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.crt" \
              --bundle "$f.bundle" \
              "$f"
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.crt \
            --bundle SHA256SUMS.bundle \
            SHA256SUMS

          # Hand the attestation step the exact files we signed rather than
          # re-expanding the caller's pattern, which by now would also sweep up
          # the .sig/.crt/.bundle files this step just created.
          {
            echo "subjects<<SUBJECTS_EOF"
            for f in "${files[@]}"; do printf 'dist/%s\n' "$f"; done
            echo "dist/SHA256SUMS"
            echo "SUBJECTS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build-provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.sign.outputs.subjects }}

      - name: Upload signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-signatures
          if-no-files-found: error
          path: |
            dist/*.sig
            dist/*.crt
            dist/*.bundle
            dist/SHA256SUMS
