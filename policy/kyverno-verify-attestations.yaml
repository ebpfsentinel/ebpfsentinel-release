# Require signed attestations, not just a signature.
#
# kyverno-verify-images.yaml answers "did we build this?". This answers
# "and what did we know about it?" — an SBOM, and a vulnerability scan that
# was run recently enough to mean something.
#
# Apply ALONGSIDE kyverno-verify-images.yaml; this policy does not verify the
# image signature itself.
#
# The scan-age condition is the part worth understanding: a vulnerability
# attestation is a statement about a moment in time. Without an age bound, an
# image signed and scanned two years ago satisfies "has a scan attestation"
# forever — a check that reports success while telling you nothing.
#
# Attestor entries are written out in full rather than shared via a YAML
# anchor. This is a policy customers apply and auditors read; it should not
# require resolving merge keys to see which repositories are trusted.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: ebpfsentinel-verify-attestations
  annotations:
    policies.kyverno.io/title: Verify eBPFsentinel attestations
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Requires every ghcr.io/ebpfsentinel/* image to carry an SPDX SBOM
      attestation and a vulnerability-scan attestation no older than 30 days,
      both signed by the eBPFsentinel release identity and issued from an
      authorized source repository.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: require-sbom-attestation
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/ebpfsentinel/*"
          # Signature verification and digest mutation belong to
          # kyverno-verify-images.yaml. Two policies rewriting the same tag is
          # a conflict waiting to happen.
          mutateDigest: false
          verifyDigest: false
          required: true
          attestations:
            - type: https://spdx.dev/Document
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        subject: "https://github.com/ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@refs/tags/v*"
                        issuer: "https://token.actions.githubusercontent.com"
                        additionalExtensions:
                          githubWorkflowRepository: ebpfsentinel/ebpfsentinel
                      ctlog:
                        ignoreSCT: false
                    - keyless:
                        subject: "https://github.com/ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@refs/tags/v*"
                        issuer: "https://token.actions.githubusercontent.com"
                        additionalExtensions:
                          githubWorkflowRepository: ebpfsentinel/ebpfsentinel-enterprise
                      ctlog:
                        ignoreSCT: false
                    - keyless:
                        subject: "https://github.com/ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@refs/tags/v*"
                        issuer: "https://token.actions.githubusercontent.com"
                        additionalExtensions:
                          githubWorkflowRepository: ebpfsentinel/ebpfsentinel-operator
                      ctlog:
                        ignoreSCT: false
                    - keyless:
                        subject: "https://github.com/ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@refs/tags/v*"
                        issuer: "https://token.actions.githubusercontent.com"
                        additionalExtensions:
                          githubWorkflowRepository: ebpfsentinel/ebpfsentinel-dashboard
                      ctlog:
                        ignoreSCT: false

    - name: require-recent-vulnerability-scan
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/ebpfsentinel/*"
          mutateDigest: false
          verifyDigest: false
          required: true
          attestations:
            - type: https://in-toto.io/attestation/vulns/v0.1
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        subject: "https://github.com/ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@refs/tags/v*"
                        issuer: "https://token.actions.githubusercontent.com"
                        additionalExtensions:
                          githubWorkflowRepository: ebpfsentinel/ebpfsentinel
                      ctlog:
                        ignoreSCT: false
                    - keyless:
                        subject: "https://github.com/ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@refs/tags/v*"
                        issuer: "https://token.actions.githubusercontent.com"
                        additionalExtensions:
                          githubWorkflowRepository: ebpfsentinel/ebpfsentinel-enterprise
                      ctlog:
                        ignoreSCT: false
                    - keyless:
                        subject: "https://github.com/ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@refs/tags/v*"
                        issuer: "https://token.actions.githubusercontent.com"
                        additionalExtensions:
                          githubWorkflowRepository: ebpfsentinel/ebpfsentinel-operator
                      ctlog:
                        ignoreSCT: false
                    - keyless:
                        subject: "https://github.com/ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-image.yml@refs/tags/v*"
                        issuer: "https://token.actions.githubusercontent.com"
                        additionalExtensions:
                          githubWorkflowRepository: ebpfsentinel/ebpfsentinel-dashboard
                      ctlog:
                        ignoreSCT: false
              conditions:
                - all:
                    # sign-image.yml stamps scanFinishedOn when it builds the
                    # vulns/v0.1 predicate. 720h = 30 days; tighten it if your
                    # release cadence allows, but do not remove it.
                    - key: "{{ time_since('', '{{ metadata.scanFinishedOn }}', '') }}"
                      operator: LessThanOrEquals
                      value: "720h"
