# Release coordination manifest — copy to releases/<version>.yaml.
#
# This is the single declaration of what "release 2026.6.1" means across the
# component repositories. `cut-release.yml` builds from it and
# `issue-measurements.yml` reads it to decide what to measure and sign, so a
# component left out here is neither built nor signed — the manifest is
# load-bearing, not documentation.
#
# `release:` is the product version. Each component carries its OWN version:
# they ship on their own cadence, and pretending otherwise would force a
# version bump on four repositories because one of them changed.
#
# `ref:` is the commit each component is built from, as a full 40-character
# sha. Nothing else is accepted: the build runs here rather than in the
# component repository, so this field is the only record of what went into the
# binaries, and a branch name would move under it. Fill it with
#   git -C ../<component> rev-parse origin/main
#
# Every component listed here must also have a `## [<its version>]` section in
# changelogs/<name>.md, in the same pull request. Validate both with:
#   ./scripts/check-release-manifest.py releases/<version>.yaml
schema: ebpfsentinel.release/v1
release: "2026.6.1"
date: "2026-06-30"
status: rc # rc | stable | yanked

# yanked_reason: required when status is yanked; a yanked release with no
# stated reason makes every reader guess whether it was a build slip or a
# security problem. Revoking the digests is separate — see docs/REVOCATION.md.

components:
  # `image:` takes a list when a component publishes more than one: the agent
  # and the warden broker are one deployment, and an inventory naming only the
  # agent describes something nobody can run.
  - name: ebpfsentinel
    repo: ebpfsentinel/ebpfsentinel
    version: "2026.6.1"
    ref: "0000000000000000000000000000000000000000" # git rev-parse origin/main
    license: AGPL-3.0-only
    image:
      - ghcr.io/ebpfsentinel/ebpfsentinel
      - ghcr.io/ebpfsentinel/ebpfsentinel-warden
    binaries:
      - name: ebpfsentinel-agent
        tarball: "ebpfsentinel-{version}-linux-{arch}.tar.gz"
        arches: [amd64, arm64]

  - name: ebpfsentinel-enterprise
    repo: ebpfsentinel/ebpfsentinel-enterprise
    version: "2026.6.1"
    ref: "0000000000000000000000000000000000000000"
    license: LicenseRef-Proprietary
    image:
      - ghcr.io/ebpfsentinel/ebpfsentinel-enterprise
      - ghcr.io/ebpfsentinel/ebpfsentinel-enterprise-warden
    binaries:
      - name: ebpfsentinel-enterprise-agent
        tarball: "ebpfsentinel-enterprise-{version}-linux-{arch}.tar.gz"
        arches: [amd64, arm64]
      - name: ebpfsentinel-license
        tarball: "ebpfsentinel-enterprise-{version}-linux-{arch}.tar.gz"
        arches: [amd64, arm64]

  # Two images from one source tree: the second is the same operator compiled
  # with `--features enterprise`, which is what a licensed cluster runs.
  - name: ebpfsentinel-operator
    repo: ebpfsentinel/ebpfsentinel-operator
    version: "2026.6.1"
    ref: "0000000000000000000000000000000000000000"
    license: AGPL-3.0-only
    image:
      - ghcr.io/ebpfsentinel/ebpfsentinel-operator
      - ghcr.io/ebpfsentinel/ebpfsentinel-operator-enterprise

  - name: ebpfsentinel-dashboard
    repo: ebpfsentinel/ebpfsentinel-dashboard
    version: "2026.6.1"
    ref: "0000000000000000000000000000000000000000"
    license: LicenseRef-Proprietary
    image: ghcr.io/ebpfsentinel/ebpfsentinel-dashboard

  # A component can ship as crates.io packages and nothing else. It is measured
  # from the registry's own checksum for the published version, which is what a
  # `cargo build` of a dependent resolves against — so the inventory covers what
  # a customer's build actually pulls, not a tarball we happened to attach.
  - name: anomstream
    repo: ebpfsentinel/anomstream
    version: "2026.4.1"
    ref: "0000000000000000000000000000000000000000"
    license: Apache-2.0
    crates:
      - anomstream
      - anomstream-core
      - anomstream-triage
      - anomstream-hotpath

# What this set of components runs against. These are the questions customers
# ask first, and the ones that fail at load time rather than at install time.
compatibility:
  kernel_min: "6.9"
  kubernetes: ">=1.30, <=1.34"
  notes: >-
    Rootless deployment additionally requires
    kernel.apparmor_restrict_unprivileged_userns=1 on the node.

# Optional, but worth filling in — it is what a customer reads when deciding
# whether an upgrade is safe.
supersedes: "2026.6.0"
highlights: []
breaking_changes: []
