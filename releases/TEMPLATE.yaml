# Release coordination manifest — copy to releases/<version>.yaml.
#
# This is the single declaration of what "release 2026.6.1" means across seven
# repositories. `issue-measurements.yml` reads it to decide what to measure and
# sign, so a component left out here is left out of the signed inventory — the
# manifest is load-bearing, not documentation.
#
# Validate before committing:
#   ./scripts/check-release-manifest.py releases/<version>.yaml
schema: ebpfsentinel.release/v1
release: "2026.6.1"
date: "2026-06-30"
status: rc # rc | stable | yanked

# yanked_reason: required when status is yanked; a yanked release with no
# stated reason makes every reader guess whether it was a build slip or a
# security problem. Revoking the digests is separate — see docs/REVOCATION.md.

components:
  - name: ebpfsentinel
    repo: ebpfsentinel/ebpfsentinel
    version: "2026.6.1"
    license: AGPL-3.0-only
    image: ghcr.io/ebpfsentinel/ebpfsentinel
    binaries:
      - name: ebpfsentinel-agent
        tarball: "ebpfsentinel-{version}-linux-{arch}.tar.gz"
        arches: [amd64, arm64]

  - name: ebpfsentinel-enterprise
    repo: ebpfsentinel/ebpfsentinel-enterprise
    version: "2026.6.1"
    license: LicenseRef-Proprietary
    image: ghcr.io/ebpfsentinel/ebpfsentinel-enterprise
    binaries:
      - name: ebpfsentinel-enterprise-agent
        tarball: "ebpfsentinel-enterprise-{version}-linux-{arch}.tar.gz"
        arches: [amd64, arm64]
      - name: ebpfsentinel-license
        tarball: "ebpfsentinel-enterprise-{version}-linux-{arch}.tar.gz"
        arches: [amd64, arm64]

  - name: ebpfsentinel-operator
    repo: ebpfsentinel/ebpfsentinel-operator
    version: "2026.6.1"
    license: AGPL-3.0-only
    image: ghcr.io/ebpfsentinel/ebpfsentinel-operator

  - name: ebpfsentinel-dashboard
    repo: ebpfsentinel/ebpfsentinel-dashboard
    version: "2026.6.1"
    license: LicenseRef-Proprietary
    image: ghcr.io/ebpfsentinel/ebpfsentinel-dashboard

# What this set of components runs against. These are the questions customers
# ask first, and the ones that fail at load time rather than at install time.
compatibility:
  kernel_min: "6.9"
  kubernetes: ">=1.30, <=1.34"
  notes: >-
    Rootless deployment additionally requires
    kernel.apparmor_restrict_unprivileged_userns=1 on the node.

# Optional, but worth filling in — it is what a customer reads when deciding
# whether an upgrade is safe.
supersedes: "2026.6.0"
highlights: []
breaking_changes: []
